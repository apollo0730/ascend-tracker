function calcDeal(f,roster,installedCounts){
  const W=parseFloat(f.size)||0,SP=parseFloat(f.ppw)||0,CO=parseFloat(f.cr)||2;
  if(!W||!SP||!f.setter||!f.closer)return null;
  const sR=roster[f.setter]||{redline:2.60},cR=roster[f.closer]||{redline:2.60};
  const SR=sR.redline,CR=cR.redline;
  const rev=W*SP,coRev=W*CO,margin=rev-coRev;
  const minRL=Math.min(SR,CR),maxRL=Math.max(SR,CR);
  const rldiff=(maxRL-minRL)*W;
  const repPool=(SP-minRL)*W;
  const baseEach=repPool/2;
  const ascGross=(minRL-CO)*W+rldiff;
  let sBase,cBase;
  if(SR<=CR){sBase=baseEach;cBase=Math.max(0,baseEach-rldiff);}
  else{cBase=baseEach;sBase=Math.max(0,baseEach-rldiff);}
  // Tyler: $0.10/W when he's manager on setter or closer
  const tylerActive=f.setterTeam==='tyler'||f.closerTeam==='tyler';
  const tylerB=tylerActive?0.10*W:0;
  // Jim: flat $150 only when Tyler is active
  const jimB=tylerActive?150:0;
  // Ty Cali: flat $150 always
  const tyCalib=150;
  let lPPW=0;
  if(f.setterTeam==='larissa')lPPW+=.05;
  if(f.closerTeam==='larissa')lPPW+=.05;
  const larisaTB=lPPW*W;
  const jPPW=lPPW*0.25;
  const jermaineB=jPPW*W;
  const recMap={};
  const chk=rn=>{const rep=roster[rn];if(!rep||!rep.recruiter)return;const recInstalls=installedCounts?installedCounts[rep.recruiter]||0:(roster[rep.recruiter]||{}).fundedDeals||0;if(recInstalls>=3)recMap[rep.recruiter]=(recMap[rep.recruiter]||0)+.01*W;};
  if(f.setter)chk(f.setter);
  if(f.closer&&f.closer!==f.setter)chk(f.closer);
  const recTotal=Object.values(recMap).reduce((s,v)=>s+v,0);
  const adders=(f.adders||[]).filter(a=>parseFloat(a.amount)>0);
  const adderTotal=adders.reduce((s,a)=>s+parseFloat(a.amount),0);
  let rem=adderTotal,dS=0,dC=0,dT=0,dJ=0,dTC=0,dL=0,dA=0;
  if(rem>0){const rp=sBase+cBase,t=Math.min(rem,rp);dS=Math.min(t/2,sBase);dC=Math.min(t-dS,cBase);rem-=(dS+dC);}
  if(rem>0){const mp=tylerB+jimB+tyCalib+larisaTB;if(mp>0){const t=Math.min(rem,mp);dT=tylerB/mp*t;dJ=jimB/mp*t;dTC=tyCalib/mp*t;dL=larisaTB/mp*t;rem-=t;}}
  if(rem>0)dA=rem;
  const sNet=sBase-dS,cNet=cBase-dC;
  const tylerNet=tylerB-dT,jimNet=jimB-dJ,tyCalinet=tyCalib-dTC;
  const lTNet=larisaTB-dL,jRat=larisaTB>0?jPPW/lPPW:0;
  const jermaineNet=lTNet*jRat,larisaNet=lTNet-jermaineNet,larisaB=larisaTB-jermaineB;
  const ascProfit=ascGross-tylerB-jimB-tyCalib-larisaTB-recTotal-dA;
  const sum=coRev+sNet+cNet+tylerNet+jimNet+tyCalinet+larisaNet+jermaineNet+recTotal+ascProfit;
  return{W,SP,CO,rev,coRev,margin,SR,CR,minRL,maxRL,rldiff,sBase,cBase,ascGross,
    lPPW,jPPW,tylerB,jimB,tyCalib,larisaTB,larisaB,jermaineB,
    recMap,recTotal,adders,adderTotal,
    dd:{s:dS,c:dC,t:dT,j:dJ,tc:dTC,l:dL,a:dA},
    sNet,cNet,tylerNet,jimNet,tyCalinet,larisaNet,jermaineNet,ascProfit,
    ok:Math.abs(sum+adderTotal-rev)<0.02,verify:sum+adderTotal};
}

}

function isaacWeeks(deals){
  const blitz=deals.filter(d=>!d.cancelled&&(d.setterTeam==='larissa'||d.closerTeam==='larissa'));
  const today=new Date();today.setHours(23,59,59,999);
  const ntpWeeks={},instWeeks={};
  const weekKey=dt=>{const d=new Date(dt),dow=d.getDay(),mon=new Date(d);mon.setDate(d.getDate()-(dow===0?6:dow-1));return mon.toISOString().slice(0,10);};
  blitz.forEach(d=>{
    if(d.entryDate){const k=weekKey(d.entryDate);ntpWeeks[k]=(ntpWeeks[k]||0)+1;}
    if(d.installDate&&new Date(d.installDate)<=today){const k=weekKey(d.installDate);instWeeks[k]=(instWeeks[k]||0)+1;}
  });
  const allWeeks=[...new Set([...Object.keys(ntpWeeks),...Object.keys(instWeeks)])].sort();
  let streak=0;
  return allWeeks.map(wk=>{
    const ntpCount=ntpWeeks[wk]||0,instCount=instWeeks[wk]||0;
    if(ntpCount>=10)streak++;else streak=0;
    let ntpBonus=0;
    if(ntpCount>=10){if(streak===1)ntpBonus=1000;else if(streak===2)ntpBonus=2500;else ntpBonus=5000;}
    const instBonus=instCount>=30?5000:instCount>=20?2500:0;
    return{week:wk,ntpCount,instCount,bonus:Math.max(ntpBonus,instBonus),streak};
  }).reverse();
}

function TSel({value,onChange,opts,placeholder}){
  return <select value={value} onChange={e=>onChange(e.target.value)} style={{width:'100%',boxSizing:'border-box',padding:'8px 12px',background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:10,color:'var(--color-text-primary)',fontSize:14,outline:'none'}}>
    <option value="">{placeholder||'Select...'}</option>
    {opts.map(o=><option key={o.v!=null?o.v:o} value={o.v!=null?o.v:o} style={{color:'var(--color-text-primary)'}}>{o.l!=null?o.l:o}</option>)}
  </select>;
}
function Btn({onClick,disabled,variant,full,children}){
  const bg=disabled?'var(--color-background-secondary)':variant==='success'?C.emerald:variant==='outline'?'transparent':C.indigo;
  const col=disabled?'var(--color-text-tertiary)':variant==='outline'?C.indigo:'white';
  const bdr=variant==='outline'?'1.5px solid '+(disabled?'var(--color-border-tertiary)':C.indigo):'none';
  return <button onClick={disabled?undefined:onClick} style={{background:bg,color:col,border:bdr,padding:'10px 16px',borderRadius:10,fontWeight:700,fontSize:14,cursor:disabled?'not-allowed':'pointer',width:full?'100%':undefined,opacity:disabled?0.6:1}}>
    {children}
  </button>;
}
function PayRow({label,sub,ppwR,base,net,deduct,color}){
  const hasDed=deduct&&deduct>.005;
  return <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'0.5px solid var(--color-border-tertiary)'}}>
    <div>
      <div style={{fontSize:14,fontWeight:500,color:'var(--color-text-primary)'}}>{label}</div>
      {ppwR!=null&&<div style={{fontSize:12,color:'var(--color-text-tertiary)'}}>${ppwR.toFixed(4)}/W</div>}
      {sub&&<div style={{fontSize:12,color:'var(--color-text-tertiary)'}}>{sub}</div>}
      {hasDed&&<div style={{fontSize:12,color:C.red}}>{'- '+FMT(deduct)+' from adders'}</div>}
    </div>
    <div style={{textAlign:'right'}}>
      {hasDed&&base!=null&&Math.abs(base-net)>.005&&<div style={{fontSize:12,color:'var(--color-text-tertiary)',textDecoration:'line-through'}}>{FMT(base)}</div>}
      <div style={{fontWeight:700,fontSize:15,color:color||'var(--color-text-primary)'}}>{FMT(net)}</div>
    </div>
  </div>;
}
function PPWBar({r,form}){
  if(!r)return null;
  const segs=[{l:'Gamma Solar',v:r.CO,c:'#94a3b8'},{l:form.setter||'Setter',v:r.sNet/r.W,c:C.blue},{l:form.closer||'Closer',v:r.cNet/r.W,c:C.purple}];
  segs.push({l:'Tyler',v:r.tylerNet/r.W,c:C.orange});
  segs.push({l:'Jim',v:r.jimNet/r.W,c:'#0891b2'});
  segs.push({l:'Ty Cali',v:r.tyCalinet/r.W,c:'#0e7490'});
  segs.push({l:'Ty Cali',v:(r.tyCalinet||0)/r.W,c:'#0e7490'});
  if((r.tylerNet||0)>0)segs.push({l:'Tyler',v:r.tylerNet/r.W,c:C.orange});
  if((r.jimNet||0)>0)segs.push({l:'Jim',v:r.jimNet/r.W,c:'#0891b2'});
  if(r.larisaNet>0)segs.push({l:'Larissa',v:r.larisaNet/r.W,c:C.pink});
  if(r.jermaineNet>0)segs.push({l:'Jermaine',v:r.jermaineNet/r.W,c:'#f43f5e'});
  if(r.recTotal>0)segs.push({l:'Recruiter',v:r.recTotal/r.W,c:C.amber});
  if(r.adderTotal>0)segs.push({l:'Adders',v:r.adderTotal/r.W,c:'#cbd5e1'});
  segs.push({l:'Ascend',v:r.ascProfit/r.W,c:C.emerald});
  const valid=segs.filter(s=>s.v>.0001);
  return <div style={{marginTop:8}}>
    <div style={{display:'flex',height:22,borderRadius:6,overflow:'hidden',gap:1}}>
      {valid.map((s,i)=><div key={i} title={s.l+': $'+s.v.toFixed(4)+'/W'} style={{flex:s.v,background:s.c,minWidth:2}}/>)}
    </div>
    <div style={{display:'flex',flexWrap:'wrap',gap:'4px 12px',marginTop:7}}>
      {valid.map((s,i)=><span key={i} style={{fontSize:11,color:'var(--color-text-secondary)',display:'flex',alignItems:'center',gap:5}}>
        <span style={{width:8,height:8,borderRadius:2,background:s.c,flexShrink:0,display:'inline-block'}}/>
        {s.l+': $'+s.v.toFixed(3)+'/W'}
      </span>)}
    </div>
  </div>;
}

function AdminPanel({roster,setRoster,deals,setDeals,onClose}){
  const [pw,setPw]=useState('');
  const [unlocked,setUnlocked]=useState(false);
  const [tab,setTab]=useState('tokens');
  const [selRep,setSelRep]=useState('');
  const [adj,setAdj]=useState('');
  const [adjType,setAdjType]=useState('tokens');
  const [msg,setMsg]=useState('');
  const reps=repList(roster);

  const tryUnlock=()=>{
    if(pw==='Titameme'){setUnlocked(true);setMsg('');}
    else{setMsg('Incorrect password.');}
  };

  const apply=()=>{
    if(!selRep)return;
    const val=parseInt(adj);
    if(isNaN(val))return;
    setRoster(p=>{
      const rep=p[selRep]||{};
      let updated={...rep};
      if(adjType==='tokens') updated.tokens=Math.max(0,(rep.tokens||0)+val);
      if(adjType==='xp') updated.totalEarned=Math.max(0,(rep.totalEarned||0)+val);
      if(adjType==='set_tokens') updated.tokens=Math.max(0,val);
      if(adjType==='set_xp') updated.totalEarned=Math.max(0,val);
      if(adjType==='set_redline') updated.redline=val===240?2.40:2.60;
      if(adjType==='set_funded') updated.fundedDeals=Math.max(0,val);
      return{...p,[selRep]:updated};
    });
    setMsg('Applied: '+adjType+' '+( val>0?'+':'')+val+' to '+selRep);
    setAdj('');
  };

  const setOverride=(key,val)=>{
    if(!selRep)return;
    setRoster(p=>({...p,[selRep]:{...(p[selRep]||{}),[key]:val}}));
    setMsg('Set '+key+' = '+val+' for '+selRep);
  };

  const toggleCancel=(dealId)=>{

        <button onClick={tryUnlock} style={{padding:'10px',borderRadius:9,background:C.red,color:'white',border:'none',fontWeight:700,cursor:'pointer'}}>Unlock</button>
        {msg&&<div style={{fontSize:12,color:C.red,textAlign:'center'}}>{msg}</div>}

            <div style={{display:'flex',gap:8}}>

            </div>

        </div>}

        {tab==='deals'&&<div style={{display:'flex',flexDirection:'column',gap:8}}>
          <div style={{fontSize:12,color:'var(--color-text-secondary)',marginBottom:4}}>Toggle cancelled status, or mark any deal as NTP.</div>
          <div style={{maxHeight:320,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
            {deals.filter(d=>!selRep||(d.setter===selRep||d.closer===selRep)).slice(0,50).map(d=>(
              <div key={d.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:8,background:'var(--color-background-secondary)'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:'var(--color-text-primary)'}}>{d.setter+' + '+d.closer}</div>
                  <div style={{fontSize:11,color:'var(--color-text-tertiary)'}}>{d.installDate||'no date'} · {FMT(d.result?.rev||0)}</div>
                </div>
                {d.cancelled&&<span style={{fontSize:10,color:C.red,fontWeight:700}}>CANCELLED</span>}
                {d.ntp&&<span style={{fontSize:10,color:C.emerald,fontWeight:700}}>NTP</span>}
                <button onClick={()=>toggleCancel(d.id)} style={{fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:6,border:'1px solid '+(d.cancelled?C.emerald:C.red),color:d.cancelled?C.emerald:C.red,background:'transparent',cursor:'pointer'}}>
                  {d.cancelled?'Restore':'Cancel'}
                </button>
                <button onClick={()=>setDeals(p=>p.map(x=>x.id===d.id?{...x,ntp:!x.ntp}:x))} style={{fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:6,border:'1px solid '+(d.ntp?C.slate:C.emerald),color:d.ntp?C.slate:C.emerald,background:'transparent',cursor:'pointer'}}>
                  {d.ntp?'Un-NTP':'NTP'}
                </button>
              </div>
            ))}
          </div>
        </div>}

        {msg&&<div style={{fontSize:13,padding:'10px 14px',background:C.emeraldL,border:'1px solid '+C.emerald+'50',borderRadius:9,color:C.emeraldD,fontWeight:600}}>{msg}</div>}

        <button onClick={()=>{setUnlocked(false);setPw('');setMsg('');}} style={{padding:'8px',borderRadius:9,border:'1px solid var(--color-border-tertiary)',background:'transparent',color:'var(--color-text-tertiary)',fontSize:12,cursor:'pointer'}}>Lock admin panel</button>
      </div>}
    </div>
  </div>;
}

function ArenaTab({deals,roster,setRoster,setCongrats}){

  const repData=reps.map(name=>{

    const ntp=active.filter(d=>d.setter===name||d.closer===name).length;
    const earned=rep.totalEarned||0;
    const bal=rep.tokens||0;

          </div>
        ))}
      </div>
    </div>}
  </div>;
}

// ─── MY TEAM TAB ──────────────────────────────────────────────────────────────
function MyTeamTab({roster,deals,activity}){
  const [selRecruiter,setSelRecruiter]=useState('');
  const reps=repList(roster);
  const today=new Date();today.setHours(23,59,59,999);
  const active=deals.filter(d=>!d.cancelled);

  // Build recruiter list (reps who have at least 1 recruit)
  const recruiters=[...new Set(reps.filter(n=>(roster[n]||{}).recruiter).map(n=>roster[n].recruiter))].sort();

  // For each recruiter, get their recruits
  const getRecruits=rec=>reps.filter(n=>(roster[n]||{}).recruiter===rec);

  // For each rep, compute all stats
  const repStats=name=>{
    const rep=roster[name]||{};
    // Activity stats (all time)
    const logs=activity.filter(a=>a.rep===name);
    const bills=logs.reduce((s,a)=>s+(parseInt(a.bills)||0),0);
    const apptSet=logs.reduce((s,a)=>s+(parseInt(a.apptSet)||0),0);
    const sits=logs.reduce((s,a)=>s+(parseInt(a.apptSat)||parseInt(a.sits)||0),0);
    // Deals
    const myDeals=active.filter(d=>d.setter===name||d.closer===name);
    const closed=myDeals.length;
    const installed=myDeals.filter(d=>d.installDate&&new Date(d.installDate)<=today).length;
    const cancelled=deals.filter(d=>d.cancelled&&(d.setter===name||d.closer===name)).length;
    const cancelRate=closed+cancelled>0?Math.round((cancelled/(closed+cancelled))*100):0;
    // 90-day pace
    const pace90=count90(name,active);
    // XP / level
    const xp=rep.totalEarned||0;
    const lvl=getLevelInfo(xp);
    return{name,bills,apptSet,sits,closed,installed,cancelled,cancelRate,pace90,xp,lvl,tokens:rep.tokens||0};
  };

  const StatCell=({label,value,sub,color,warn})=>(
    <div style={{textAlign:'center',padding:'8px 4px'}}>
      <div style={{fontSize:18,fontWeight:900,color:warn?C.red:color||'var(--color-text-primary)',lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:9,color:warn?C.red:color||'var(--color-text-tertiary)',fontWeight:600}}>{sub}</div>}
      <div style={{fontSize:10,color:'var(--color-text-tertiary)',marginTop:2}}>{label}</div>
    </div>
  );

  const RepCard=({name,rank})=>{
    const s=repStats(name);
    const rep=roster[name]||{};
    const paceColor=rosterColor(s.pace90);
    return <div style={{
      border:'1px solid var(--color-border-secondary)',borderRadius:14,overflow:'hidden',
      background:'var(--color-background-primary)'
    }}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'var(--color-background-secondary)',borderBottom:'1px solid var(--color-border-secondary)'}}>
        {rank&&<div style={{width:24,height:24,borderRadius:'50%',background:['#d97706','#94a3b8','#b45309','#6366f1'][Math.min(rank-1,3)],display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:900,color:'white',flexShrink:0}}>
          {rank<=3?['🥇','🥈','🥉'][rank-1]:rank}
        </div>}
        <div style={{width:36,height:36,borderRadius:'50%',background:'linear-gradient(135deg,'+s.lvl.color+','+s.lvl.color+'70)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,fontWeight:900,color:'white',flexShrink:0}}>
          {name.slice(0,1)}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:800,fontSize:14,color:'var(--color-text-primary)'}}>{name}</div>
          <div style={{display:'flex',alignItems:'center',gap:6,marginTop:1}}>
            <span style={{fontSize:11,padding:'1px 6px',borderRadius:999,background:s.lvl.color+'20',color:s.lvl.color,fontWeight:700,border:'1px solid '+s.lvl.color+'30'}}>{s.lvl.icon+' '+s.lvl.name}</span>
            <span style={{fontSize:10,color:'#fbbf24',fontWeight:700}}>{'⚡ '+s.xp+' XP'}</span>
            <span style={{fontSize:10,color:'var(--color-text-tertiary)'}}>${'$'+( rep.redline||2.60)}</span>
          </div>
        </div>
        <div style={{textAlign:'right',flexShrink:0}}>
          <div style={{fontSize:11,fontWeight:700,color:paceColor==='green'?C.emerald:paceColor==='yellow'?C.amber:paceColor==='orange'?C.orange:C.red}}>
            {s.pace90+'/10'}
          </div>
          <div style={{fontSize:9,color:'var(--color-text-tertiary)'}}>90-day pace</div>
        </div>
      </div>
      {/* Stats grid */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:0,borderBottom:'0.5px solid var(--color-border-secondary)'}}>
        <StatCell label="Bills" value={s.bills} color={C.blue}/>
        <StatCell label="Appts Set" value={s.apptSet} color={C.indigo}/>
        <StatCell label="Sits" value={s.sits} color={C.purple}/>
        <StatCell label="Closed" value={s.closed} color={C.emerald}/>
        <StatCell label="Installed" value={s.installed} color={C.emeraldD}/>
        <StatCell label="Cancel %" value={s.cancelRate+'%'} color={C.red} warn={s.cancelRate>20}/>
      </div>
      {/* Token bar */}
      <div style={{padding:'6px 14px',display:'flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:11,color:'var(--color-text-tertiary)'}}>Tokens:</span>
        <span style={{fontSize:12,fontWeight:800,color:'#fbbf24'}}>{s.tokens}</span>

            <div style={{width:'100%',height:configs.h,background:configs.bg,borderRadius:'10px 10px 0 0',boxShadow:configs.shadow,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4}}>
              <div style={{fontSize:pos===0?32:24,fontWeight:900,color:'white'}}>{rep.installs}</div>
              <div style={{fontSize:10,color:'rgba(255,255,255,0.7)',fontWeight:600}}>{configs.label}</div>
              <div style={{fontSize:10,color:'rgba(255,255,255,0.6)'}}>{lvl.emoji} {lvl.name}</div>
            </div>
          </div>;
        })}
      </div>
    </div>}

    <div style={card}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <Label>Install leaderboard</Label>
        <div style={{display:'flex',gap:10,fontSize:11,color:'var(--color-text-tertiary)'}}>
          <span style={{fontWeight:700,color:C.emerald}}>installs</span><span>/ NTP</span>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:3}}>
        {leaderboard.map((rep,i)=>{
          const isTop=i<3&&rep.installs>0;
          const barPct=maxInst>0?(rep.installs/maxInst)*100:0;
          const convRate=rep.ntp>0?Math.round((rep.installs/rep.ntp)*100):0;
          return <div key={rep.name} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 10px',borderRadius:8,background:isTop?C.indigoL:'transparent'}}>
            <div style={{width:26,textAlign:'center',flexShrink:0}}>
              {isTop?<span style={{fontSize:15}}>{medals[i]}</span>:<span style={{fontSize:11,fontWeight:700,color:'var(--color-text-tertiary)'}}>{'#'+(i+1)}</span>}
            </div>
            <div style={{width:110,flexShrink:0}}>
              <div style={{fontSize:13,fontWeight:700,color:isTop?C.indigoD:'var(--color-text-primary)'}}>{rep.name}</div>
              <div style={{display:'flex',gap:4,marginTop:2,flexWrap:'wrap',alignItems:'center'}}>
                <Pill bg={rep.redline===2.40?C.emeraldL:C.amberL} color={rep.redline===2.40?C.emeraldD:C.gold}>{'$'+rep.redline+(rep.redline===2.40?' \u2605':'')}</Pill>
                <LionBadge pts={goldenPts(rep.name,active)}/>
              </div>
            </div>
            <div style={{flex:1}}>
              <div style={{height:6,background:'var(--color-background-secondary)',borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',width:barPct+'%',background:isTop?C.indigo:C.slate,borderRadius:3,transition:'width .5s'}}/>
              </div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
              <span style={{fontSize:15,fontWeight:800,color:isTop?C.indigo:'var(--color-text-primary)'}}>{rep.installs}</span>
              <span style={{fontSize:11,color:'var(--color-text-tertiary)'}}>{'/ '+rep.ntp+' NTP'}</span>
              {rep.ntp>0&&<span style={{fontSize:10,padding:'2px 6px',borderRadius:999,background:convRate>=80?C.emeraldL:C.amberL,color:convRate>=80?C.emeraldD:C.gold,fontWeight:700}}>{convRate+'%'}</span>}
            </div>
          </div>;
        })}
      </div>
    </div>
  </div>;
}


function AccountabilityTab({deals,roster}){
  const active=deals.filter(d=>!d.cancelled);
  const cancelled=deals.filter(d=>d.cancelled);
  const cancelRate=deals.length>0?((cancelled.length/deals.length)*100).toFixed(1):'0.0';
  const repStats={};
  const reps=repList(roster);
  reps.forEach(n=>{repStats[n]={ntp:0,cancelled:0};});
  deals.forEach(d=>{
    [d.setter,d.closer].forEach(rn=>{
      if(!rn||!repStats[rn])return;
      repStats[rn].ntp++;
      if(d.cancelled)repStats[rn].cancelled++;
    });
  });
  const withCancels=reps.filter(n=>repStats[n]&&repStats[n].cancelled>0).sort((a,b)=>repStats[b].cancelled-repStats[a].cancelled);
  const atRisk=reps.filter(n=>{const rep=roster[n]||{};return rep.redline===2.40&&rosterColor(count90(n,active))==='red';});
  const yellowing=reps.filter(n=>{const rep=roster[n]||{};const col=rosterColor(count90(n,active));return rep.redline===2.40&&(col==='yellow'||col==='orange');});
  const allClear=withCancels.length===0&&atRisk.length===0&&yellowing.length===0;

  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{...card,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
      {[
        {l:'Total NTP',v:deals.length,c:C.indigo},
        {l:'Active',v:active.length,c:C.emerald},
        {l:'Cancelled',v:cancelled.length,c:C.red},
        {l:'Cancel rate',v:cancelRate+'%',c:parseFloat(cancelRate)>15?C.red:parseFloat(cancelRate)>8?C.amber:C.emerald},
      ].map(({l,v,c})=><div key={l} style={{textAlign:'center',padding:'8px',background:'var(--color-background-secondary)',borderRadius:9}}>
        <div style={{fontSize:22,fontWeight:800,color:c,lineHeight:1}}>{v}</div>
        <div style={{fontSize:11,color:'var(--color-text-secondary)',marginTop:4}}>{l}</div>
      </div>)}
    </div>

    {atRisk.length>0&&<div style={{...card,border:'1px solid '+C.red+'40',background:C.redL}}>
      <Label c={C.red}>Discuss demotion — $2.40 to $2.60</Label>
      <div style={{fontSize:12,color:C.red,marginBottom:10}}>90+ days behind install pace. Management discussion needed.</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:8}}>
        {atRisk.map(n=>{
          const cnt=count90(n,active);
          return <div key={n} style={{background:'var(--color-background-primary)',borderRadius:8,padding:'10px 12px',border:'1px solid '+C.red+'30'}}>
            <div style={{fontWeight:700,fontSize:13,color:'var(--color-text-primary)'}}>{n}</div>
            <div style={{fontSize:11,color:C.red,marginTop:2}}>{cnt+'/10 installs in 90 days'}</div>
            <div style={{height:4,background:'var(--color-background-secondary)',borderRadius:2,overflow:'hidden',marginTop:6}}>
              <div style={{height:'100%',width:Math.min(100,(cnt/10)*100)+'%',background:C.red,borderRadius:2}}/>
            </div>
          </div>;
        })}
      </div>
    </div>}

    {yellowing.length>0&&<div style={{...card,border:'1px solid '+C.amber+'40',background:C.amberL}}>
      <Label c={C.gold}>Watch list — falling behind pace</Label>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {yellowing.map(n=>{
          const cnt=count90(n,active);
          return <div key={n} style={{background:'var(--color-background-primary)',borderRadius:7,padding:'7px 12px',border:'1px solid '+C.amber+'40',fontSize:12}}>
            <span style={{fontWeight:700,color:'var(--color-text-primary)'}}>{n}</span>
            <span style={{color:C.amber,marginLeft:6}}>{cnt+'/10'}</span>
          </div>;
        })}
      </div>
    </div>}

    {withCancels.length>0&&<div style={card}>
      <Label>Cancellations by rep</Label>
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {withCancels.map(n=>{
          const s=repStats[n];
          const rate=s.ntp>0?Math.round((s.cancelled/s.ntp)*100):0;
          return <div key={n} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 10px',borderRadius:8,background:'var(--color-background-secondary)'}}>
            <div style={{width:90,flexShrink:0,fontWeight:700,fontSize:13,color:'var(--color-text-primary)'}}>{n}</div>
            <div style={{flex:1}}>
              <div style={{height:5,background:'var(--color-background-primary)',borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',width:Math.min(100,rate)+'%',background:rate>20?C.red:C.amber,borderRadius:3}}/>
              </div>
            </div>
            <span style={{fontSize:12,color:'var(--color-text-tertiary)',flexShrink:0}}>{s.ntp+' NTP'}</span>
            <span style={{fontSize:13,fontWeight:700,color:C.red,flexShrink:0}}>{s.cancelled+' cancelled'}</span>
            <span style={{fontSize:11,padding:'2px 7px',borderRadius:999,background:C.redL,color:C.red,fontWeight:700,flexShrink:0}}>{rate+'%'}</span>
          </div>;
        })}
      </div>
    </div>}

    {allClear&&<div style={{...card,textAlign:'center',padding:'40px',color:'var(--color-text-tertiary)',fontSize:14}}>All clear — no cancellations or demotion concerns.</div>}
  </div>;
}


function ActivityTab({activity,setActivity,roster,onAwardTokens}){
  const reps=repList(roster);
  const EMPTY_LOG={rep:'',date:new Date().toISOString().slice(0,10),role:'setter',
    knocks:'',pitches:'',bills:'',apptSet:'',apptSat:'',noShow:'',rescheduled:'',
    sits:'',closed:'',sitNoClose:'',closerNoShow:'',notes:''};
  const [form,setForm]=useState(EMPTY_LOG);
  const [saved,setSaved]=useState(false);
  const [sheetsWarning,setSheetsWarning]=useState(false);
  const [congrats,setCongrats]=useState(null);
  const [showAdmin,setShowAdmin]=useState(false);
  const [autoExportStatus,setAutoExportStatus]=useState('');
  const [viewRep,setViewRep]=useState('');
  const u=(k,v)=>setForm(p=>({...p,[k]:v}));
  const n=v=>parseInt(v)||0;

  const STANDARDS={knocks:{v:100,label:'100/day'},pitches:{v:8,label:'8/day'},bills:{v:1,label:'1/day'},sits:{v:4,label:'4/week',weekly:true}};

  const save=()=>{
    if(!form.rep||!form.date)return;
    const logEntry={...form,id:Date.now().toString(),savedAt:new Date().toISOString()};
    setActivity(p=>[logEntry,...p]);
    db.saveActivity(logEntry);
    // Award tokens for knocks, bills, sits
    if(form.rep&&onAwardTokens){
      let tokAmt=0;
      if(n(form.knocks)>0)tokAmt+=TOKEN_RATES.knock*n(form.knocks);
      if(n(form.bills)>0)tokAmt+=TOKEN_RATES.bill*n(form.bills);
      if(n(form.sits)>0)tokAmt+=TOKEN_RATES.sit*n(form.sits);
      if(tokAmt>0)onAwardTokens(form.rep,tokAmt,'activity');
    }
    if(form.rep&&onAwardTokens){
      const bills=parseInt(form.bills)||0;
      const sits=parseInt(form.sits)||0;
      if(bills>0)onAwardTokens(form.rep,bills*TOKEN_RATES.bill,'bill');
      if(sits>0)onAwardTokens(form.rep,sits*TOKEN_RATES.sit,'sit');
    }
    setForm(p=>({...EMPTY_LOG,rep:p.rep,date:p.date,role:p.role}));
    setSaved(true);setTimeout(()=>setSaved(false),3000);
  };

  const today=new Date().toISOString().slice(0,10);
  const getMonday=()=>{const d=new Date(),dow=d.getDay(),m=new Date(d);m.setDate(d.getDate()-(dow===0?6:dow-1));m.setHours(0,0,0,0);return m;};
  const weekStart=getMonday();
  const last7=new Date();last7.setDate(last7.getDate()-6);last7.setHours(0,0,0,0);

  // Compute per-rep rolling stats
  const repStats={};
  reps.forEach(name=>{
    const logs=activity.filter(a=>a.rep===name);
    const l7=logs.filter(a=>new Date(a.date)>=last7);
    const wk=logs.filter(a=>new Date(a.date)>=weekStart);
    const days=l7.length||1;
    repStats[name]={
      avgKnocks:l7.reduce((s,a)=>s+n(a.knocks),0)/days,
      avgPitches:l7.reduce((s,a)=>s+n(a.pitches),0)/days,
      avgBills:l7.reduce((s,a)=>s+n(a.bills),0)/days,
      weeklySits:wk.reduce((s,a)=>s+n(a.sits),0),
      days:l7.length
    };
  });

  // Today entries
  const todayLogs=activity.filter(a=>a.date===today);

  // Color for metric vs standard
  const metricColor=(val,std)=>val>=std?C.emerald:val>=std*.7?C.amber:C.red;
  const metricBg=(val,std)=>val>=std?C.emeraldL:val>=std*.7?C.amberL:C.redL;

  // Active reps (logged in last 7 days)
  const activeReps=reps.filter(n=>repStats[n].days>0).sort((a,b)=>{
    const sa=repStats[a],sb=repStats[b];
    return (sb.avgKnocks+sb.avgPitches*10)-(sa.avgKnocks+sa.avgPitches*10);
  });

  const iStyle={padding:'7px 10px',background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:9,color:'var(--color-text-primary)',fontSize:14,outline:'none',width:'100%',boxSizing:'border-box'};
  const numInput=(k,label,std)=><div style={{display:'flex',flexDirection:'column',gap:3}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600}}>{label}</label>
      {std&&<span style={{fontSize:10,color:'var(--color-text-tertiary)'}}>{std}</span>}
    </div>
    <input type="number" min="0" value={form[k]} onChange={e=>u(k,e.target.value)} placeholder="0"
      style={{...iStyle,fontSize:16,fontWeight:700,textAlign:'center',padding:'10px 6px',color:form[k]&&std?metricColor(n(form[k]),typeof std==='number'?std:0):'var(--color-text-primary)'}}/>
  </div>;

  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    {/* LOG FORM */}
    <div style={card}>
      <Label>Log daily activity</Label>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:12}}>
        <div>
          <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600,display:'block',marginBottom:4}}>Rep</label>
          <TSel value={form.rep} onChange={v=>u('rep',v)} opts={reps.map(n=>({v:n,l:n}))} placeholder="Select rep..."/>
        </div>
        <div>
          <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600,display:'block',marginBottom:4}}>Date</label>
          <input type="date" value={form.date} onChange={e=>u('date',e.target.value)} style={iStyle}/>
        </div>
        <div>
          <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600,display:'block',marginBottom:4}}>Role today</label>
          <div style={{display:'flex',gap:4}}>
            {['setter','closer','both'].map(r=><button key={r} onClick={()=>u('role',r)} style={{flex:1,padding:'7px 4px',borderRadius:8,border:'1.5px solid '+(form.role===r?C.indigo:'var(--color-border-secondary)'),background:form.role===r?C.indigoL:'transparent',color:form.role===r?C.indigoD:'var(--color-text-tertiary)',fontSize:12,fontWeight:700,cursor:'pointer',textTransform:'capitalize'}}>{r}</button>)}
          </div>
        </div>
      </div>

      {(form.role==='setter'||form.role==='both')&&<div style={{marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,color:C.blue,marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
          <span>Setter activity</span>
          <span style={{fontSize:10,color:'var(--color-text-tertiary)',fontWeight:400}}>Standards: 100 knocks · 8 pitches · 1 bill per day</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
          {numInput('knocks','Knocks','100/day')}
          {numInput('pitches','Pitches','8/day')}
          {numInput('bills','Bills','1/day')}
          {numInput('apptSet','Appts Set','')}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
          {numInput('apptSat','Appts Sat','')}
          {numInput('noShow','No Shows','')}
          {numInput('rescheduled','Rescheduled','')}
        </div>
      </div>}

      {(form.role==='closer'||form.role==='both')&&<div style={{marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,color:C.purple,marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
          <span>Closer activity</span>
          <span style={{fontSize:10,color:'var(--color-text-tertiary)',fontWeight:400}}>Standard: 4 sits per week</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
          {numInput('sits','Sits','4/wk')}
          {numInput('closed','Closed','')}
          {numInput('sitNoClose','Sit No Close','')}
          {numInput('closerNoShow','No Shows','')}
        </div>
      </div>}

      <div style={{marginBottom:12}}>
        <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600,display:'block',marginBottom:4}}>Notes / comments</label>
        <textarea value={form.notes} onChange={e=>u('notes',e.target.value)} placeholder="Anything notable about today..." rows={2}
          style={{...iStyle,resize:'none'}}/>
      </div>
      <Btn onClick={save} disabled={!form.rep} variant="success" full>{saved?'Logged!':'Save activity log'}</Btn>
    </div>

    {/* TODAY BOARD */}
    {todayLogs.length>0&&<div style={card}>
      <Label>{"Today's board — "+new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</Label>
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {todayLogs.map(log=>(
          <div key={log.id} style={{padding:'10px 12px',borderRadius:9,background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-tertiary)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:log.notes?8:0}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontWeight:700,fontSize:14,color:'var(--color-text-primary)'}}>{log.rep}</span>
                <span style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:999,background:log.role==='setter'?C.blueL:log.role==='closer'?C.purpleL:C.indigoL,color:log.role==='setter'?C.blue:log.role==='closer'?C.purple:C.indigo,textTransform:'capitalize'}}>{log.role}</span>
              </div>
              <button onClick={()=>setActivity(p=>p.filter(a=>a.id!==log.id))} style={{background:'transparent',border:'none',cursor:'pointer',color:'var(--color-text-tertiary)',fontSize:14,padding:'0 4px'}}>x</button>
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}}>
              {(log.role==='setter'||log.role==='both')&&[
                ['Knocks',n(log.knocks),100],['Pitches',n(log.pitches),8],['Bills',n(log.bills),1],
                ['Set',n(log.apptSet),0],['Sat',n(log.apptSat),0],['No Show',n(log.noShow),0],['Reschedule',n(log.rescheduled),0]
              ].filter(([,v])=>v>0||['Knocks','Pitches','Bills'].includes('')).map(([lbl,val,std])=>(
                <div key={lbl} style={{padding:'4px 10px',borderRadius:7,background:std>0?metricBg(val,std):'var(--color-background-primary)',border:'0.5px solid var(--color-border-tertiary)',textAlign:'center'}}>
                  <div style={{fontSize:16,fontWeight:800,color:std>0?metricColor(val,std):'var(--color-text-primary)'}}>{val}</div>
                  <div style={{fontSize:10,color:'var(--color-text-tertiary)'}}>{lbl}</div>
                </div>
              ))}
              {(log.role==='closer'||log.role==='both')&&[
                ['Sits',n(log.sits),0],['Closed',n(log.closed),0],['No Close',n(log.sitNoClose),0],['No Show',n(log.closerNoShow),0]
              ].filter(([,v])=>v>0).map(([lbl,val])=>(
                <div key={'c'+lbl} style={{padding:'4px 10px',borderRadius:7,background:'var(--color-background-primary)',border:'0.5px solid var(--color-border-tertiary)',textAlign:'center'}}>
                  <div style={{fontSize:16,fontWeight:800,color:'var(--color-text-primary)'}}>{val}</div>
                  <div style={{fontSize:10,color:'var(--color-text-tertiary)'}}>{lbl}</div>
                </div>
              ))}
            </div>
            {log.notes&&<div style={{marginTop:6,fontSize:12,color:'var(--color-text-secondary)',fontStyle:'italic'}}>{'Note: '+log.notes}</div>}
          </div>
        ))}
      </div>
    </div>}

    {/* STANDARDS CHECK — rolling 7-day */}
    {activeReps.length>0&&<div style={card}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <Label>7-day rolling averages vs standards</Label>
        <span style={{fontSize:11,color:'var(--color-text-tertiary)'}}>green = on track, red = below</span>
      </div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
          <thead>
            <tr style={{borderBottom:'1.5px solid var(--color-border-tertiary)'}}>
              <th style={{textAlign:'left',padding:'6px 10px',color:'var(--color-text-tertiary)',fontWeight:700,fontSize:11}}>Rep</th>
              <th style={{textAlign:'center',padding:'6px 8px',color:'var(--color-text-tertiary)',fontWeight:700,fontSize:11}}>Days logged</th>
              <th style={{textAlign:'center',padding:'6px 8px',color:C.blue,fontWeight:700,fontSize:11}}>Knocks<br/><span style={{color:'var(--color-text-tertiary)',fontWeight:400}}>100/d</span></th>
              <th style={{textAlign:'center',padding:'6px 8px',color:C.blue,fontWeight:700,fontSize:11}}>Pitches<br/><span style={{color:'var(--color-text-tertiary)',fontWeight:400}}>8/d</span></th>
              <th style={{textAlign:'center',padding:'6px 8px',color:C.blue,fontWeight:700,fontSize:11}}>Bills<br/><span style={{color:'var(--color-text-tertiary)',fontWeight:400}}>1/d</span></th>
              <th style={{textAlign:'center',padding:'6px 8px',color:C.purple,fontWeight:700,fontSize:11}}>Sits/wk<br/><span style={{color:'var(--color-text-tertiary)',fontWeight:400}}>4/wk</span></th>
            </tr>
          </thead>
          <tbody>
            {activeReps.map(name=>{
              const s=repStats[name];
              const logs=activity.filter(a=>a.rep===name&&new Date(a.date)>=last7);
              const hasCloser=logs.some(a=>a.role==='closer'||a.role==='both');
              const hasSetter=logs.some(a=>a.role==='setter'||a.role==='both');
              return <tr key={name} style={{borderBottom:'0.5px solid var(--color-border-tertiary)'}}>
                <td style={{padding:'8px 10px',fontWeight:700,color:'var(--color-text-primary)'}}>{name}</td>
                <td style={{textAlign:'center',padding:'8px',color:'var(--color-text-tertiary)'}}>{s.days}</td>
                {hasSetter?<>
                  <td style={{textAlign:'center',padding:'8px'}}>

    {/* LOG HISTORY */}
    {activity.length>0&&<div style={card}>

        {activity.filter(a=>!viewRep||a.rep===viewRep).slice(0,50).map(log=>(

              <div style={{fontSize:12,fontWeight:700,color:'var(--color-text-primary)'}}>{log.date}</div>
              <span style={{fontSize:10,padding:'1px 6px',borderRadius:999,background:log.role==='setter'?C.blueL:log.role==='closer'?C.purpleL:C.indigoL,color:log.role==='setter'?C.blue:log.role==='closer'?C.purple:C.indigo,fontWeight:700}}>{log.role}</span>
            </div>
            <div style={{fontWeight:700,fontSize:13,color:'var(--color-text-primary)',width:70,flexShrink:0}}>{log.rep}</div>
            <div style={{flex:1,display:'flex',flexWrap:'wrap',gap:4,fontSize:11}}>
              {(log.role==='setter'||log.role==='both')&&[['K',n(log.knocks),100],['P',n(log.pitches),8],['B',n(log.bills),1],['Set',n(log.apptSet),0],['Sat',n(log.apptSat),0]].filter(([,v])=>v>0).map(([l,v,s])=>(
                <span key={l} style={{padding:'1px 7px',borderRadius:4,background:s>0?metricBg(v,s):'var(--color-background-primary)',color:s>0?metricColor(v,s):'var(--color-text-secondary)',fontWeight:700}}>{l+': '+v}</span>
              ))}
              {(log.role==='closer'||log.role==='both')&&[['Sits',n(log.sits),0],['Closed',n(log.closed),0]].filter(([,v])=>v>0).map(([l,v])=>(
                <span key={l} style={{padding:'1px 7px',borderRadius:4,background:'var(--color-background-primary)',color:'var(--color-text-secondary)',fontWeight:700}}>{l+': '+v}</span>
              ))}
              {log.notes&&<span style={{fontStyle:'italic',color:'var(--color-text-tertiary)',marginLeft:4}}>{log.notes}</span>}
            </div>
          </div>
        ))}
      </div>
    </div>}
  </div>;
}

function PipelineTab({deals,roster}){
  const now=new Date();now.setHours(23,59,59,999);
  const active=deals.filter(d=>!d.cancelled);
  const getMonday=()=>{const d=new Date(),dow=d.getDay(),m=new Date(d);m.setDate(d.getDate()-(dow===0?6:dow-1));m.setHours(0,0,0,0);return m;};
  const weekStart=getMonday();
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);weekEnd.setHours(23,59,59,999);
  const reps=repList(roster);
  const repWeekNTP={},repWeekInst={},repEarnings={};
  reps.forEach(n=>{repWeekNTP[n]=0;repWeekInst[n]=0;repEarnings[n]=0;});
  active.forEach(d=>{
    const entryDt=new Date(d.entryDate);
    const instDt=d.installDate?new Date(d.installDate):null;
    const thisWeekNTP=entryDt>=weekStart&&entryDt<=weekEnd;
    const installed=instDt&&instDt<=now;
    const thisWeekInst=installed&&instDt>=weekStart&&instDt<=weekEnd;
    if(d.setter&&repWeekNTP[d.setter]!=null){
      if(thisWeekNTP)repWeekNTP[d.setter]++;
      if(thisWeekInst)repWeekInst[d.setter]++;
      repEarnings[d.setter]+=(d.result?.sNet||0);
    }
    if(d.closer&&d.closer!==d.setter&&repWeekNTP[d.closer]!=null){
      if(thisWeekNTP)repWeekNTP[d.closer]++;
      if(thisWeekInst)repWeekInst[d.closer]++;
      repEarnings[d.closer]+=(d.result?.cNet||0);
    }
  });
  const scoreboard=reps.map(n=>({name:n,ntp:repWeekNTP[n],installs:repWeekInst[n],allTime:repEarnings[n]})).sort((a,b)=>b.ntp-a.ntp||b.installs-a.installs);
  const maxNTP=scoreboard.reduce((m,r)=>Math.max(m,r.ntp),1);
  const maxEarned=reps.reduce((m,n)=>Math.max(m,repEarnings[n]),1);
  const medals=['🥇','🥈','🥉'];
  const pending=active.filter(d=>!d.installDate||new Date(d.installDate)>now);
  const withDate=pending.filter(d=>d.installDate).sort((a,b)=>new Date(a.installDate)-new Date(b.installDate));
  const noDate=pending.filter(d=>!d.installDate);
  const daysSince=d=>Math.floor((now-new Date(d.entryDate))/(1000*60*60*24));

  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{...card,border:'1px solid '+C.indigo+'30'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <Label>This week — NTP & installs</Label>
        <span style={{fontSize:11,color:'var(--color-text-tertiary)'}}>{weekStart.toLocaleDateString()+' to '+weekEnd.toLocaleDateString()}</span>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:20,marginBottom:8,fontSize:11,fontWeight:700,paddingRight:10}}>
        <span style={{color:C.indigo,width:32,textAlign:'right'}}>NTP</span>
        <span style={{color:C.emerald,width:32,textAlign:'right'}}>Inst.</span>
        <span style={{color:C.amber,width:70,textAlign:'right'}}>All-time $</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:3}}>
        {scoreboard.map((rep,i)=>{
          const top=i<3&&rep.ntp>0;
          return <div key={rep.name} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 10px',borderRadius:8,background:top?C.indigoL:'transparent'}}>
            <div style={{width:22,textAlign:'center',flexShrink:0}}>
              {top?<span style={{fontSize:13}}>{medals[i]}</span>:<span style={{fontSize:11,fontWeight:700,color:'var(--color-text-tertiary)'}}>{'#'+(i+1)}</span>}
            </div>
            <div style={{width:80,flexShrink:0,fontSize:13,fontWeight:700,color:top?C.indigoD:'var(--color-text-primary)'}}>{rep.name}</div>
            <div style={{flex:1}}>
              <div style={{height:5,background:'var(--color-background-secondary)',borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',width:(rep.ntp/maxNTP*100)+'%',background:top?C.indigo:C.slate,borderRadius:3}}/>
              </div>
            </div>
            <span style={{fontSize:14,fontWeight:900,color:rep.ntp>0?C.indigo:'var(--color-text-tertiary)',width:32,textAlign:'right'}}>{rep.ntp}</span>
            <span style={{fontSize:14,fontWeight:900,color:rep.installs>0?C.emerald:'var(--color-text-tertiary)',width:32,textAlign:'right'}}>{rep.installs}</span>
            <span style={{fontSize:12,fontWeight:700,color:rep.allTime>0?C.amber:'var(--color-text-tertiary)',width:70,textAlign:'right'}}>{rep.allTime>0?FMT(rep.allTime):'—'}</span>
          </div>;
        })}
      </div>
    </div>

    <div style={card}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <Label>{'Install pipeline ('+pending.length+' deals pending)'}</Label>
        {noDate.length>0&&<span style={{fontSize:11,color:C.amber,fontWeight:700}}>{noDate.length+' missing install date'}</span>}
      </div>
      {pending.length===0&&<div style={{textAlign:'center',padding:'20px',color:'var(--color-text-tertiary)',fontSize:13}}>All NTP deals have installed.</div>}
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {withDate.map(d=>{
          const daysNTP=daysSince(d);
          const daysToInstall=Math.round((new Date(d.installDate)-now)/(1000*60*60*24));
          const overdue=daysNTP>30;
          const soon=daysToInstall>=0&&daysToInstall<=7;
          return <div key={d.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:9,background:overdue?C.redL:soon?C.emeraldL:'var(--color-background-secondary)',border:'1px solid '+(overdue?C.red:soon?C.emerald:'transparent')+'30'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--color-text-primary)'}}>{d.setter+' + '+d.closer}</div>
              <div style={{fontSize:11,color:'var(--color-text-tertiary)'}}>{(d.result?.W?((d.result.W/1000).toFixed(1)+'kW · '):'')+FMT(d.result?.rev||0)+(d.notes?' · '+d.notes:'')}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:12,fontWeight:700,color:overdue?C.red:soon?C.emerald:'var(--color-text-primary)'}}>{'Install '+d.installDate}</div>
              <div style={{fontSize:11,color:overdue?C.red:soon?C.emeraldD:'var(--color-text-tertiary)'}}>
                {overdue?('NTP '+daysNTP+'d ago — OVERDUE'):soon?('In '+daysToInstall+'d'):('NTP '+daysNTP+'d ago')}
              </div>
            </div>
          </div>;
        })}
        {noDate.map(d=>{
          const daysNTP=daysSince(d);
          const late=daysNTP>30;
          return <div key={d.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:9,background:late?C.redL:'var(--color-background-secondary)',border:'1px solid '+(late?C.red:'transparent')+'30'}}>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--color-text-primary)'}}>{d.setter+' + '+d.closer}</div>
              <div style={{fontSize:11,color:'var(--color-text-tertiary)'}}>{(d.result?.W?((d.result.W/1000).toFixed(1)+'kW · '):'')+FMT(d.result?.rev||0)}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:12,color:late?C.red:'var(--color-text-tertiary)',fontWeight:late?700:400}}>No install date</div>
              <div style={{fontSize:11,color:late?C.red:'var(--color-text-tertiary)'}}>{'NTP '+daysNTP+'d ago'+(late?' — set a date!':'')}</div>
            </div>
          </div>;
        })}
      </div>
    </div>

    <div style={card}>
      <Label>All-time rep earnings</Label>
      <div style={{display:'flex',flexDirection:'column',gap:3}}>
        {reps.map(n=>({name:n,earned:repEarnings[n]||0})).sort((a,b)=>b.earned-a.earned).map((rep,i)=>{
          const top=i<3&&rep.earned>0;
          return <div key={rep.name} style={{display:'flex',alignItems:'center',gap:10,padding:'6px 10px',borderRadius:7,background:top?C.amberL:'transparent'}}>
            <div style={{width:22,textAlign:'center',flexShrink:0}}>
              {top?<span style={{fontSize:13}}>{medals[i]}</span>:<span style={{fontSize:11,color:'var(--color-text-tertiary)'}}>{'#'+(i+1)}</span>}
            </div>
            <div style={{width:80,flexShrink:0,fontSize:13,fontWeight:700,color:top?C.gold:'var(--color-text-primary)'}}>{rep.name}</div>
            <div style={{flex:1}}>
              <div style={{height:5,background:'var(--color-background-secondary)',borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',width:(rep.earned/maxEarned*100)+'%',background:top?C.amber:C.slate,borderRadius:3}}/>
              </div>
            </div>
            <span style={{fontSize:13,fontWeight:800,color:top?C.gold:rep.earned>0?'var(--color-text-primary)':'var(--color-text-tertiary)',width:72,textAlign:'right'}}>{rep.earned>0?FMT(rep.earned):'—'}</span>
          </div>;
        })}
      </div>
    </div>
  </div>;
}

function CalculatorTab({form,setForm,result,roster,onSave,onExport,saved,expMsg,onNewDeal,autoExportStatus}){
  const u=(k,v)=>setForm(p=>({...p,[k]:v}));
  const r=result;

  const upAdder=(i,k,v)=>setForm(p=>({...p,adders:p.adders.map((a,j)=>j===i?{...a,[k]:v}:a)}));

          <div><label style={lbl}>Sale price</label><TInput value={form.ppw} onChange={v=>u('ppw',v)} type="number" placeholder="3.00" pre="$" suf="/W"/></div>
          <div><label style={lbl}>Company redline</label><TInput value={form.cr} onChange={v=>u('cr',v)} type="number" placeholder="2.00" pre="$" suf="/W"/></div>
          <div><label style={lbl}>Install date</label><TInput value={form.installDate} onChange={v=>u('installDate',v)} type="date"/></div>
        </div>
        {r&&<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginTop:12}}>
          {[{l:'Total revenue',v:FMT(r.rev),c:'var(--color-text-primary)'},{l:'Gamma Solar keeps',v:FMT(r.coRev),c:'var(--color-text-secondary)'},{l:'Rep + Ascend margin',v:FMT(r.margin),c:C.emerald}].map(({l,v,c})=>(
            <div key={l} style={{background:'var(--color-background-secondary)',borderRadius:10,padding:'10px 12px',textAlign:'center'}}>
              <div style={{fontSize:11,color:'var(--color-text-tertiary)',marginBottom:3}}>{l}</div>
              <div style={{fontSize:13,fontWeight:700,color:c}}>{v}</div>

          <div key={rk} style={{...cardSm,borderTop:'3px solid '+c}}>

            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <TSel value={form[rk]} onChange={v=>u(rk,v)} opts={repOpts} placeholder={'Select '+title.toLowerCase()+'...'}/>

              </div>
              {isCustom&&<input value={a.cname||''} onChange={e=>upAdder(i,'cname',e.target.value)} placeholder="Custom adder name..."

      {!r?<div style={{...card,textAlign:'center',padding:'64px 24px'}}>
        <div style={{fontSize:44,marginBottom:14}}>🧮</div>
        <div style={{color:'var(--color-text-tertiary)',fontSize:14}}>Fill in deal details to see the full commission breakdown.</div>

        <div style={card}><Label>Per-watt breakdown — {'$'+r.SP+'/W sale'}</Label><PPWBar r={r} form={form}/></div>

        <div style={card}>
          <Label>Rep payouts</Label>
          {r.SR!==r.CR&&<div style={{marginBottom:10,padding:'9px 12px',background:C.amberL,border:'1px solid '+C.amber,borderRadius:10,fontSize:12,color:C.gold}}>
            {'Mixed redlines: '+form.setter+' $'+r.SR+(r.SR===2.40?' \u2605':'')+' · '+form.closer+' $'+r.CR+(r.CR===2.40?' \u2605':'')+'. Ascend takes extra '+FMT(r.rldiff)+' ($'+((r.rldiff/r.W).toFixed(2))+'/W) from the $'+r.maxRL+' rep.'}

          {r.jimB>0&&<PayRow label="Jim" ppwR={null} base={r.jimB} net={r.jimNet} deduct={r.dd.j||0} color="#0891b2" sub="Flat $150 — Tyler active"/>}
          {r.larisaTB>0&&<>
            <PayRow label="Larissa (Blitz)" ppwR={r.lPPW-r.jPPW} base={r.larisaB} net={r.larisaNet} deduct={r.dd.l*(r.larisaB/(r.larisaTB||1))} color={C.pink}/>
            <PayRow label="Jermaine — 25% of Larissa" ppwR={r.jPPW} base={r.jermaineB} net={r.jermaineNet} deduct={r.dd.l*(r.jermaineB/(r.larisaTB||1))} color="#f43f5e" sub="Senior Director override"/>

        {r.recTotal>0&&<div style={card}>

        {r.adderTotal>0&&<div style={{...card,border:'1px solid '+C.red+'30'}}>
          <Label c={C.red}>{'Adder waterfall — '+FMT(r.adderTotal)+' total'}</Label>
          <div style={{display:'flex',flexDirection:'column',gap:2,marginBottom:10}}>
            {r.adders.map((a,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'4px 0',borderBottom:'0.5px solid var(--color-border-tertiary)'}}>
              <span style={{color:'var(--color-text-secondary)'}}>{a.name==='Custom'?a.cname:a.name||a.cname||'—'}</span>
              <span style={{color:C.red,fontWeight:500}}>{FMT(parseFloat(a.amount||0))}</span>
            </div>)}
          </div>
          {[r.dd.s>.005&&['From '+form.setter,r.dd.s,C.blue],r.dd.c>.005&&['From '+form.closer,r.dd.c,C.purple],(r.dd.t+r.dd.j+r.dd.tc+r.dd.l)>.005&&['From managers',r.dd.t+r.dd.j+r.dd.tc+r.dd.l,C.orange],r.dd.a>.005&&['From Ascend',r.dd.a,C.emerald]].filter(Boolean).map(([l,v,c],i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 0'}}>
              <span style={{color:'var(--color-text-secondary)'}}>{'← '+l}</span>
              <span style={{color:c,fontWeight:500}}>{FMT(v)}</span>
            </div>
          ))}
        </div>}

        <div style={{...card,border:'1.5px solid '+C.emerald+'40'}}>
          <Label>Ascend summary</Label>
          <div style={{display:'flex',flexDirection:'column',gap:7}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:14}}><span style={{color:'var(--color-text-secondary)'}}>Gross margin</span><span>{FMT(r.ascGross)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Tyler ($0.10/W)'}</span><span>{FMT(r.tylerB)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Jim (flat)'}</span><span>{FMT(r.jimB)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Ty Cali (tech)'}</span><span>{FMT(r.tyCalib)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Ty Cali (tech $150)'}</span><span>{FMT(r.tyCalib||0)}</span></div>
            {r.larisaTB>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Larissa + Jermaine'}</span><span>{FMT(r.larisaTB)}</span></div>}
            {r.recTotal>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Recruit overrides'}</span><span>{FMT(r.recTotal)}</span></div>}
            {r.dd.a>.005&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Adder overflow'}</span><span>{FMT(r.dd.a)}</span></div>}
            <div style={{display:'flex',justifyContent:'space-between',fontSize:16,fontWeight:800,paddingTop:10,borderTop:'1px solid '+C.emerald+'40'}}>
              <span style={{color:C.emerald}}>Net profit</span>
              <span style={{color:r.ascProfit>=0?C.emerald:C.red}}>{FMT(r.ascProfit)}</span>
            </div>
          </div>
        </div>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 14px',borderRadius:10,border:'1px solid '+(r.ok?C.emerald:C.red)+'50',background:r.ok?C.emeraldL:C.redL,fontSize:12}}>
          <span style={{color:r.ok?C.emeraldD:C.red,fontWeight:700}}>{r.ok?'All dollars accounted for':'Calculation mismatch — check inputs'}</span>
          <span style={{color:'var(--color-text-tertiary)'}}>{FMT(r.verify)+' / '+FMT(r.rev)}</span>
        </div>
      </>}
    </div>
  </div>;
}

function HistoryTab({deals,setDeals,roster}){
  const reps=repList(roster);
  const [q,setQ]=useState('');
  const [filter,setFilter]=useState('all');
  const filt=deals.filter(d=>{
    const sq=q.toLowerCase();
    const mq=!sq||(d.setter||'').toLowerCase().includes(sq)||(d.closer||'').toLowerCase().includes(sq)||(d.notes||'').toLowerCase().includes(sq);
    const mf=filter==='all'||(filter==='active'&&!d.cancelled)||(filter==='cancelled'&&d.cancelled);
    return mq&&mf;
  });
  const toggle=(id,key)=>setDeals(p=>p.map(d=>d.id===id?{...d,[key]:!d[key]}:d));
  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search by rep name or notes..."
        style={{flex:1,minWidth:180,padding:'8px 12px',background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:10,color:'var(--color-text-primary)',fontSize:14,outline:'none'}}/>
      <div style={{display:'flex',gap:4}}>
        {[['all','All'],['active','Active'],['cancelled','Cancelled']].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{padding:'7px 14px',borderRadius:8,border:'none',fontSize:13,fontWeight:700,cursor:'pointer',background:filter===v?C.indigo:'var(--color-background-secondary)',color:filter===v?'white':'var(--color-text-secondary)'}}>
            {l}
          </button>
        ))}
      </div>
      <span style={{fontSize:12,color:'var(--color-text-tertiary)',whiteSpace:'nowrap'}}>{deals.length+' total'}</span>
    </div>
    {filt.length===0&&<div style={{...card,textAlign:'center',padding:'48px 20px',color:'var(--color-text-tertiary)',fontSize:14}}>
      {deals.length===0?'No deals yet. Enter your first NTP in the Calculator tab.':'No results.'}
    </div>}
    {filt.map(d=>{const r=d.result;if(!r)return null;return <div key={d.id} style={{...card,opacity:d.cancelled?0.65:1,borderLeft:'4px solid '+(d.cancelled?C.red:C.emerald)}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,color:'var(--color-text-primary)'}}>{d.setter+' + '+d.closer}</div>
            <div style={{fontSize:12,color:'var(--color-text-tertiary)',marginTop:2}}>
              {'Install '+d.installDate+' · Entered '+new Date(d.entryDate).toLocaleDateString()+(d.closerTeam!=='none'?' · Larissa blitz':'')}
            </div>
          </div>
          {d.cancelled&&<Pill bg={C.redL} color={C.red}>Cancelled</Pill>}
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button onClick={()=>toggle(d.id,'cancelled')} style={{fontSize:12,fontWeight:700,padding:'5px 10px',borderRadius:8,border:'1px solid '+(d.cancelled?C.emerald:C.red),background:'transparent',color:d.cancelled?C.emerald:C.red,cursor:'pointer'}}>
            {d.cancelled?'Restore':'Cancel'}
          </button>
          <button onClick={()=>{if(window.confirm('Delete this deal?'))setDeals(p=>p.filter(x=>x.id!==d.id));}} style={{background:'transparent',border:'none',cursor:'pointer',color:'var(--color-text-tertiary)',fontSize:18,padding:'2px 6px'}}>x</button>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:6}}>
        {[{l:'System',v:(r.W/1000).toFixed(2)+'kW',c:'var(--color-text-primary)'},{l:'Revenue',v:FMT(r.rev),c:'var(--color-text-primary)'},{l:d.setter,v:FMT(r.sNet),c:C.blue},{l:d.closer,v:FMT(r.cNet),c:C.purple},{l:'Managers',v:FMT((r.tylerNet||0)+(r.jimNet||0)+(r.tyCalinet||0)+(r.larisaNet||0)+(r.jermaineNet||0)),c:C.orange},{l:'Ascend',v:FMT(r.ascProfit),c:C.emerald}].map(({l,v,c})=>(
          <div key={l} style={{background:'var(--color-background-secondary)',borderRadius:8,padding:'7px 6px',textAlign:'center'}}>
            <div style={{fontSize:10,color:'var(--color-text-tertiary)',marginBottom:2}}>{l}</div>
            <div style={{fontWeight:700,fontSize:12,color:c}}>{v}</div>
          </div>
        ))}
      </div>
      {(r.adderTotal>0||d.notes)&&<div style={{marginTop:8,fontSize:12,color:'var(--color-text-tertiary)',display:'flex',gap:14}}>
        {r.adderTotal>0&&<span style={{color:C.red}}>{'Adders: '+FMT(r.adderTotal)}</span>}
        {d.notes&&<span style={{fontStyle:'italic'}}>{d.notes}</span>}
      </div>}
    </div>;})}
  </div>;
}


function RosterTab({roster,setRoster,deals,activity,installedCounts}){
  const upd=(n,k,v)=>setRoster(p=>({...p,[n]:{...p[n],[k]:v}}));
  const activeDeal=deals.filter(d=>!d.cancelled);
  const cc={green:{bg:C.emeraldL,txt:C.emeraldD,bar:C.emerald},yellow:{bg:C.amberL,txt:C.gold,bar:C.amber},orange:{bg:'#fff7ed',txt:C.orange,bar:C.orange},red:{bg:C.redL,txt:C.red,bar:C.red}};
  const reps=repList(roster);
  const [newRepName,setNewRepName]=useState('');
  const addRep=()=>{
    const nm=newRepName.trim();
    if(!nm||roster[nm])return;
    const newRep={redline:2.60,recruiter:null,fundedDeals:0,fastStartDeadline:null,trainingPaid:false,tokens:0,totalEarned:0,manualInstalls:0,manualNTP:0,records:{bestWeekNTP:0,bestWeekInstalls:0}};
    setRoster(p=>({...p,[nm]:newRep}));
    // Explicitly save to Supabase immediately
    sb.from('roster').upsert({id:nm,name:nm,redline:2.60,recruiter:null,funded_deals:0,manual_installs:0,manual_ntp:0,fast_start_deadline:null,training_paid:false,tokens:0,total_earned:0,updated_at:new Date().toISOString()},{onConflict:'id'}).then(({error})=>{if(error)console.error('addRep save error',error);});
    setNewRepName('');
  };
  const removeRep=name=>{if(!window.confirm('Remove '+name+'? Historical deal data is kept.'))return;setRoster(p=>{const n={...p};delete n[name];return n;});};
  const fastStartCount=(name,deadline)=>{
    if(!deadline)return 0;
    const dl=new Date(deadline);dl.setHours(23,59,59,999);
    return activeDeal.filter(d=>(d.setter===name||d.closer===name)&&new Date(d.entryDate)<=dl).length;
  };
  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',gap:8,marginBottom:4,alignItems:'center'}}>
      <input value={newRepName} onChange={e=>setNewRepName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addRep()} placeholder="Add new rep name..." style={{flex:1,padding:'8px 12px',background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:9,color:'var(--color-text-primary)',fontSize:14,outline:'none'}}/>
      <Btn onClick={addRep} disabled={!newRepName.trim()||!!roster[newRepName.trim()]} variant="primary">+ Add Rep</Btn>
    </div>
    <div style={{padding:'10px 14px',background:C.indigoL,borderRadius:10,fontSize:12,color:C.indigoD,display:'flex',gap:14,flexWrap:'wrap',alignItems:'center',border:'1px solid '+C.indigo+'30'}}>
      <span style={{fontWeight:700}}>Roster</span>
      <span>90-day: 10 installs keeps $2.40.</span>
      <span style={{color:C.emeraldD,fontWeight:700}}>Fast-start: 3 NTP in 30 days qualifies for $2.40.</span>
      <span style={{color:C.gold,fontWeight:700}}>Golden Door: 150 pts (1 per deal set or closed).</span>
    </div>
    {/* ── RECRUITER SUMMARY ── */}
    {(()=>{
      const recruiters=[...new Set(repList(roster).filter(n=>(roster[n]||{}).recruiter).map(n=>roster[n].recruiter))].sort();
      if(recruiters.length===0)return null;
      const today=new Date();today.setHours(23,59,59,999);
      const active=deals.filter(d=>!d.cancelled);
      return <div style={card}>
        <Label>Recruiter overview</Label>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {recruiters.map(rec=>{
            const recruits=repList(roster).filter(n=>(roster[n]||{}).recruiter===rec);
            const totalInstalls=recruits.reduce((s,n)=>s+active.filter(d=>(d.setter===n||d.closer===n)&&d.installDate&&new Date(d.installDate)<=today).length,0);
            const totalClosed=recruits.reduce((s,n)=>s+active.filter(d=>d.setter===n||d.closer===n).length,0);
            const logs=recruits.flatMap(n=>(activity||[]).filter(a=>a.rep===n));
            const totalBills=logs.reduce((s,a)=>s+(parseInt(a.bills)||0),0);
            const totalAppts=logs.reduce((s,a)=>s+(parseInt(a.apptSet)||0),0);
            return <div key={rec} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:10,background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)'}}>
              <div style={{fontWeight:700,fontSize:13,color:'var(--color-text-primary)',minWidth:80,flexShrink:0}}>{rec}</div>
              <div style={{fontSize:11,color:'var(--color-text-tertiary)',flexShrink:0}}>{recruits.length+' recruit'+(recruits.length!==1?'s':'')}</div>
              <div style={{flex:1,display:'flex',gap:12,flexWrap:'wrap',justifyContent:'flex-end'}}>
                {[['Bills',totalBills,C.blue],['Appts',totalAppts,C.indigo],['Closed',totalClosed,C.emerald],['Installed',totalInstalls,C.emeraldD]].map(([l,v,c])=>(
                  <div key={l} style={{textAlign:'center'}}>
                    <div style={{fontSize:14,fontWeight:800,color:c,lineHeight:1}}>{v}</div>
                    <div style={{fontSize:9,color:'var(--color-text-tertiary)'}}>{l}</div>
                  </div>
                ))}
              </div>
            </div>;
          })}
        </div>
      </div>;
    })()}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(230px,1fr))',gap:10}}>
      {reps.map(name=>{
        const rep=roster[name]||{redline:2.60,recruiter:null,fundedDeals:0,fastStartDeadline:null,trainingPaid:false};
        const cnt=count90(name,activeDeal);
        const col=rosterColor(cnt);
        const cfg=cc[col];
        const allTime=activeDeal.filter(d=>d.setter===name||d.closer===name).length;
        const pts=goldenPts(name,activeDeal);
        const pct150=Math.min(100,(pts/150)*100);
        const goldenDone=pts>=150;
        const installCnt=repInstallCount(name,activeDeal);
        const trainingEligible=installCnt>=3;
        const dl=rep.fastStartDeadline;
        const fsCount=fastStartCount(name,dl);
        const fsAchieved=fsCount>=3;
        const today=new Date();today.setHours(0,0,0,0);
        const dlDate=dl?new Date(dl):null;
        if(dlDate)dlDate.setHours(0,0,0,0);
        const dlPassed=dlDate&&dlDate<today;
        const daysLeft=dlDate&&!dlPassed?Math.round((dlDate-today)/(1000*60*60*24)):null;
        return <div key={name} style={{...cardSm,borderTop:'3px solid '+cfg.bar}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>

              <div style={{fontWeight:700,fontSize:14,color:'var(--color-text-primary)'}}>{name}</div>
              <div style={{display:'flex',gap:5,marginTop:3,flexWrap:'wrap',alignItems:'center'}}>
                <Pill bg={cfg.bg} color={cfg.txt}>{cnt+'/10 90d'}</Pill>
                <Pill bg='var(--color-background-secondary)' color='var(--color-text-secondary)'>{allTime+' NTP'}</Pill>
              </div>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:16,fontWeight:800,color:rep.redline===2.40?C.emerald:C.amber}}>{'$'+rep.redline}</div>
              {rep.redline===2.40&&<div style={{fontSize:10,color:C.emeraldD,fontWeight:700}}>senior</div>}
              <button onClick={()=>removeRep(name)} style={{fontSize:10,color:'var(--color-text-tertiary)',background:'transparent',border:'none',cursor:'pointer',display:'block',marginTop:2}}>remove</button>
            </div>
          </div>
          <div style={{height:3,background:'var(--color-background-secondary)',borderRadius:2,overflow:'hidden',marginBottom:10}}>
            <div style={{height:'100%',width:Math.min(100,(cnt/10)*100)+'%',background:cfg.bar,borderRadius:2}}/>
          </div>
          <div style={{marginBottom:8,padding:'8px 10px',background:trainingEligible?C.emeraldL:'var(--color-background-secondary)',borderRadius:8,border:'1px solid '+(trainingEligible?C.emerald+'50':'var(--color-border-tertiary)')}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:trainingEligible?C.emeraldD:'var(--color-text-tertiary)'}}>Patrick Kenney Training</div>
                <div style={{fontSize:10,marginTop:1,color:trainingEligible?C.emeraldD:'var(--color-text-tertiary)'}}>
                  {trainingEligible?(rep.trainingPaid?'Paid — 1 year active':'Eligible — '+installCnt+' installs'):(installCnt+'/3 installs to unlock')}
                </div>
              </div>
              {trainingEligible&&<button onClick={()=>upd(name,'trainingPaid',!rep.trainingPaid)}
                style={{fontSize:11,fontWeight:700,padding:'4px 9px',borderRadius:7,border:'1px solid '+(rep.trainingPaid?C.emerald:C.amber),background:rep.trainingPaid?C.emerald:C.amberL,color:rep.trainingPaid?'white':C.gold,cursor:'pointer',flexShrink:0,whiteSpace:'nowrap'}}>

              <div style={{height:'100%',width:Math.min(100,(installCnt/3)*100)+'%',background:C.emerald,borderRadius:2}}/>
            </div>}

          <div style={{marginBottom:10,padding:'8px 10px',background:goldenDone?C.amberL:'var(--color-background-secondary)',borderRadius:8,border:'1px solid '+(goldenDone?C.amber+'60':'var(--color-border-tertiary)')}}>

              <div style={{display:'flex',alignItems:'center',gap:5}}>
                <span style={{fontSize:18,lineHeight:1}}>&#x1F981;</span>

              <span style={{fontSize:16,fontWeight:900,color:goldenDone?C.amber:pts>=100?C.gold:'var(--color-text-primary)'}}>{pts+'/150'}</span>
            </div>
            <div style={{height:6,background:'var(--color-background-primary)',borderRadius:3,overflow:'hidden',marginBottom:4}}>
              <div style={{height:'100%',width:pct150+'%',background:goldenDone?C.amber:pts>=100?C.gold:C.indigo,borderRadius:3,transition:'width .5s'}}/>
