            </div>
          </div>;
        })}
      </div>
    </div>
  </div>;
}


function AccountabilityTab({deals,roster}){
  const active=deals.filter(d=>!d.cancelled);
  const cancelled=deals.filter(d=>d.cancelled);
  const cancelRate=deals.length>0?((cancelled.length/deals.length)*100).toFixed(1):'0.0';
  const repStats={};
  const reps=repList(roster);
  reps.forEach(n=>{repStats[n]={ntp:0,cancelled:0};});
  deals.forEach(d=>{
    [d.setter,d.closer].forEach(rn=>{
      if(!rn||!repStats[rn])return;
      repStats[rn].ntp++;
      if(d.cancelled)repStats[rn].cancelled++;
    });
  });
  const withCancels=reps.filter(n=>repStats[n]&&repStats[n].cancelled>0).sort((a,b)=>repStats[b].cancelled-repStats[a].cancelled);
  const atRisk=reps.filter(n=>{const rep=roster[n]||{};return rep.redline===2.40&&rosterColor(count90(n,active))==='red';});
  const yellowing=reps.filter(n=>{const rep=roster[n]||{};const col=rosterColor(count90(n,active));return rep.redline===2.40&&(col==='yellow'||col==='orange');});
  const allClear=withCancels.length===0&&atRisk.length===0&&yellowing.length===0;

  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{...card,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
      {[
        {l:'Total NTP',v:deals.length,c:C.indigo},
        {l:'Active',v:active.length,c:C.emerald},
        {l:'Cancelled',v:cancelled.length,c:C.red},
        {l:'Cancel rate',v:cancelRate+'%',c:parseFloat(cancelRate)>15?C.red:parseFloat(cancelRate)>8?C.amber:C.emerald},
      ].map(({l,v,c})=><div key={l} style={{textAlign:'center',padding:'8px',background:'var(--color-background-secondary)',borderRadius:9}}>
        <div style={{fontSize:22,fontWeight:800,color:c,lineHeight:1}}>{v}</div>
        <div style={{fontSize:11,color:'var(--color-text-secondary)',marginTop:4}}>{l}</div>
      </div>)}
    </div>

    {atRisk.length>0&&<div style={{...card,border:'1px solid '+C.red+'40',background:C.redL}}>
      <Label c={C.red}>Discuss demotion — $2.40 to $2.60</Label>
      <div style={{fontSize:12,color:C.red,marginBottom:10}}>90+ days behind install pace. Management discussion needed.</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:8}}>
        {atRisk.map(n=>{
          const cnt=count90(n,active);
          return <div key={n} style={{background:'var(--color-background-primary)',borderRadius:8,padding:'10px 12px',border:'1px solid '+C.red+'30'}}>
            <div style={{fontWeight:700,fontSize:13,color:'var(--color-text-primary)'}}>{n}</div>
            <div style={{fontSize:11,color:C.red,marginTop:2}}>{cnt+'/10 installs in 90 days'}</div>
            <div style={{height:4,background:'var(--color-background-secondary)',borderRadius:2,overflow:'hidden',marginTop:6}}>
              <div style={{height:'100%',width:Math.min(100,(cnt/10)*100)+'%',background:C.red,borderRadius:2}}/>
            </div>
          </div>;
        })}
      </div>
    </div>}

    {yellowing.length>0&&<div style={{...card,border:'1px solid '+C.amber+'40',background:C.amberL}}>
      <Label c={C.gold}>Watch list — falling behind pace</Label>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {yellowing.map(n=>{
          const cnt=count90(n,active);
          return <div key={n} style={{background:'var(--color-background-primary)',borderRadius:7,padding:'7px 12px',border:'1px solid '+C.amber+'40',fontSize:12}}>
            <span style={{fontWeight:700,color:'var(--color-text-primary)'}}>{n}</span>
            <span style={{color:C.amber,marginLeft:6}}>{cnt+'/10'}</span>
          </div>;
        })}
      </div>
    </div>}

    {withCancels.length>0&&<div style={card}>
      <Label>Cancellations by rep</Label>
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {withCancels.map(n=>{
          const s=repStats[n];
          const rate=s.ntp>0?Math.round((s.cancelled/s.ntp)*100):0;
          return <div key={n} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 10px',borderRadius:8,background:'var(--color-background-secondary)'}}>
            <div style={{width:90,flexShrink:0,fontWeight:700,fontSize:13,color:'var(--color-text-primary)'}}>{n}</div>
            <div style={{flex:1}}>
              <div style={{height:5,background:'var(--color-background-primary)',borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',width:Math.min(100,rate)+'%',background:rate>20?C.red:C.amber,borderRadius:3}}/>
              </div>
            </div>
            <span style={{fontSize:12,color:'var(--color-text-tertiary)',flexShrink:0}}>{s.ntp+' NTP'}</span>
            <span style={{fontSize:13,fontWeight:700,color:C.red,flexShrink:0}}>{s.cancelled+' cancelled'}</span>
            <span style={{fontSize:11,padding:'2px 7px',borderRadius:999,background:C.redL,color:C.red,fontWeight:700,flexShrink:0}}>{rate+'%'}</span>
          </div>;
        })}
      </div>
    </div>}

    {allClear&&<div style={{...card,textAlign:'center',padding:'40px',color:'var(--color-text-tertiary)',fontSize:14}}>All clear — no cancellations or demotion concerns.</div>}
  </div>;
}


function ActivityTab({activity,setActivity,roster,onAwardTokens,standards}){
  const reps=repList(roster);
  const EMPTY_LOG={rep:'',date:new Date().toISOString().slice(0,10),role:'setter',
    knocks:'',pitches:'',bills:'',apptSet:'',apptSat:'',noShow:'',rescheduled:'',
    sits:'',closed:'',sitNoClose:'',closerNoShow:'',notes:''};
  const [form,setForm]=useState(EMPTY_LOG);
  const [saved,setSaved]=useState(false);
  const [viewRep,setViewRep]=useState('');
  const u=(k,v)=>setForm(p=>({...p,[k]:v}));
  const n=v=>parseInt(v)||0;

  const std=standards||{knocks:100,pitches:8,bills:1,sits:4};
  const STANDARDS={knocks:{v:std.knocks,label:std.knocks+'/day'},pitches:{v:std.pitches,label:std.pitches+'/day'},bills:{v:std.bills,label:std.bills+'/day'},sits:{v:std.sits,label:std.sits+'/week',weekly:true}};

  const save=()=>{
    if(!form.rep||!form.date)return;
    const logEntry={...form,id:Date.now().toString(),savedAt:new Date().toISOString()};
    setActivity(p=>[logEntry,...p]);
    // Award tokens for knocks, bills, sits
    if(form.rep&&onAwardTokens){
      let tokAmt=0;
      if(n(form.knocks)>0)tokAmt+=TOKEN_RATES.knock*n(form.knocks);
      if(n(form.bills)>0)tokAmt+=TOKEN_RATES.bill*n(form.bills);
      if(n(form.sits)>0)tokAmt+=TOKEN_RATES.sit*n(form.sits);
      if(tokAmt>0)onAwardTokens(form.rep,tokAmt,'activity');
    }
    if(form.rep&&onAwardTokens){
      const bills=parseInt(form.bills)||0;
      const sits=parseInt(form.sits)||0;
      if(bills>0)onAwardTokens(form.rep,bills*TOKEN_RATES.bill,'bill');
      if(sits>0)onAwardTokens(form.rep,sits*TOKEN_RATES.sit,'sit');
    }
    setForm(p=>({...EMPTY_LOG,rep:p.rep,date:p.date,role:p.role}));
    setSaved(true);setTimeout(()=>setSaved(false),3000);
  };

  const today=new Date().toISOString().slice(0,10);
  const getMonday=()=>{const d=new Date(),dow=d.getDay(),m=new Date(d);m.setDate(d.getDate()-(dow===0?6:dow-1));m.setHours(0,0,0,0);return m;};
  const weekStart=getMonday();
  const last7=new Date();last7.setDate(last7.getDate()-6);last7.setHours(0,0,0,0);

  // Compute per-rep rolling stats
  const repStats={};
  reps.forEach(name=>{
    const logs=activity.filter(a=>a.rep===name);
    const l7=logs.filter(a=>new Date(a.date)>=last7);
    const wk=logs.filter(a=>new Date(a.date)>=weekStart);
    const days=l7.length||1;
    repStats[name]={
      avgKnocks:l7.reduce((s,a)=>s+n(a.knocks),0)/days,
      avgPitches:l7.reduce((s,a)=>s+n(a.pitches),0)/days,
      avgBills:l7.reduce((s,a)=>s+n(a.bills),0)/days,
      weeklySits:wk.reduce((s,a)=>s+n(a.sits),0),
      days:l7.length
    };
  });

  // Today entries
  const todayLogs=activity.filter(a=>a.date===today);

  // Color for metric vs standard
  const metricColor=(val,std)=>val>=std?C.emerald:val>=std*.7?C.amber:C.red;
  const metricBg=(val,std)=>val>=std?C.emeraldL:val>=std*.7?C.amberL:C.redL;

  // Active reps (logged in last 7 days)
  const activeReps=reps.filter(n=>repStats[n].days>0).sort((a,b)=>{
    const sa=repStats[a],sb=repStats[b];
    return (sb.avgKnocks+sb.avgPitches*10)-(sa.avgKnocks+sa.avgPitches*10);
  });

  const iStyle={padding:'7px 10px',background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:9,color:'var(--color-text-primary)',fontSize:14,outline:'none',width:'100%',boxSizing:'border-box'};
  const numInput=(k,label,std)=><div style={{display:'flex',flexDirection:'column',gap:3}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600}}>{label}</label>
      {std&&<span style={{fontSize:10,color:'var(--color-text-tertiary)'}}>{std}</span>}
    </div>
    <input type="number" min="0" value={form[k]} onChange={e=>u(k,e.target.value)} placeholder="0"
      style={{...iStyle,fontSize:16,fontWeight:700,textAlign:'center',padding:'10px 6px',color:form[k]&&std?metricColor(n(form[k]),typeof std==='number'?std:0):'var(--color-text-primary)'}}/>
  </div>;

  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    {/* LOG FORM */}
    <div style={card}>
      <Label>Log daily activity</Label>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:12}}>
        <div>
          <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600,display:'block',marginBottom:4}}>Rep</label>
          <TSel value={form.rep} onChange={v=>u('rep',v)} opts={reps.map(n=>({v:n,l:n}))} placeholder="Select rep..."/>
        </div>
        <div>
          <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600,display:'block',marginBottom:4}}>Date</label>
          <input type="date" value={form.date} onChange={e=>u('date',e.target.value)} style={iStyle}/>
        </div>
        <div>
          <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600,display:'block',marginBottom:4}}>Role today</label>
          <div style={{display:'flex',gap:4}}>
            {['setter','closer','both'].map(r=><button key={r} onClick={()=>u('role',r)} style={{flex:1,padding:'7px 4px',borderRadius:8,border:'1.5px solid '+(form.role===r?C.indigo:'var(--color-border-secondary)'),background:form.role===r?C.indigoL:'transparent',color:form.role===r?C.indigoD:'var(--color-text-tertiary)',fontSize:12,fontWeight:700,cursor:'pointer',textTransform:'capitalize'}}>{r}</button>)}
          </div>
        </div>
      </div>

      {(form.role==='setter'||form.role==='both')&&<div style={{marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,color:C.blue,marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
          <span>Setter activity</span>
          <span style={{fontSize:10,color:'var(--color-text-tertiary)',fontWeight:400}}>Standards: 100 knocks · 8 pitches · 1 bill per day</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
          {numInput('knocks','Knocks','100/day')}
          {numInput('pitches','Pitches','8/day')}
          {numInput('bills','Bills','1/day')}
          {numInput('apptSet','Appts Set','')}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
          {numInput('apptSat','Appts Sat','')}
          {numInput('noShow','No Shows','')}
          {numInput('rescheduled','Rescheduled','')}
        </div>
      </div>}

      {(form.role==='closer'||form.role==='both')&&<div style={{marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,color:C.purple,marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
          <span>Closer activity</span>
          <span style={{fontSize:10,color:'var(--color-text-tertiary)',fontWeight:400}}>Standard: 4 sits per week</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
          {numInput('sits','Sits','4/wk')}
          {numInput('closed','Closed','')}
          {numInput('sitNoClose','Sit No Close','')}
          {numInput('closerNoShow','No Shows','')}
        </div>
      </div>}

      <div style={{marginBottom:12}}>
        <label style={{fontSize:11,color:'var(--color-text-secondary)',fontWeight:600,display:'block',marginBottom:4}}>Notes / comments</label>
        <textarea value={form.notes} onChange={e=>u('notes',e.target.value)} placeholder="Anything notable about today..." rows={2}
          style={{...iStyle,resize:'none'}}/>
      </div>
      <Btn onClick={save} disabled={!form.rep} variant="success" full>{saved?'Logged!':'Save activity log'}</Btn>
    </div>

    {/* TODAY BOARD */}
    {todayLogs.length>0&&<div style={card}>
      <Label>{"Today's board — "+new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</Label>
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {todayLogs.map(log=>(
          <div key={log.id} style={{padding:'10px 12px',borderRadius:9,background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-tertiary)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:log.notes?8:0}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontWeight:700,fontSize:14,color:'var(--color-text-primary)'}}>{log.rep}</span>
                <span style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:999,background:log.role==='setter'?C.blueL:log.role==='closer'?C.purpleL:C.indigoL,color:log.role==='setter'?C.blue:log.role==='closer'?C.purple:C.indigo,textTransform:'capitalize'}}>{log.role}</span>
              </div>
              <button onClick={()=>setActivity(p=>p.filter(a=>a.id!==log.id))} style={{background:'transparent',border:'none',cursor:'pointer',color:'var(--color-text-tertiary)',fontSize:14,padding:'0 4px'}}>x</button>
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}}>
              {(log.role==='setter'||log.role==='both')&&[
                ['Knocks',n(log.knocks),100],['Pitches',n(log.pitches),8],['Bills',n(log.bills),1],
                ['Set',n(log.apptSet),0],['Sat',n(log.apptSat),0],['No Show',n(log.noShow),0],['Reschedule',n(log.rescheduled),0]
              ].filter(([,v])=>v>0||['Knocks','Pitches','Bills'].includes('')).map(([lbl,val,std])=>(
                <div key={lbl} style={{padding:'4px 10px',borderRadius:7,background:std>0?metricBg(val,std):'var(--color-background-primary)',border:'0.5px solid var(--color-border-tertiary)',textAlign:'center'}}>
                  <div style={{fontSize:16,fontWeight:800,color:std>0?metricColor(val,std):'var(--color-text-primary)'}}>{val}</div>
                  <div style={{fontSize:10,color:'var(--color-text-tertiary)'}}>{lbl}</div>
                </div>
              ))}
              {(log.role==='closer'||log.role==='both')&&[
                ['Sits',n(log.sits),0],['Closed',n(log.closed),0],['No Close',n(log.sitNoClose),0],['No Show',n(log.closerNoShow),0]
              ].filter(([,v])=>v>0).map(([lbl,val])=>(
                <div key={'c'+lbl} style={{padding:'4px 10px',borderRadius:7,background:'var(--color-background-primary)',border:'0.5px solid var(--color-border-tertiary)',textAlign:'center'}}>

                <span key={l} style={{padding:'1px 7px',borderRadius:4,background:s>0?metricBg(v,s):'var(--color-background-primary)',color:s>0?metricColor(v,s):'var(--color-text-secondary)',fontWeight:700}}>{l+': '+v}</span>
              ))}
              {(log.role==='closer'||log.role==='both')&&[['Sits',n(log.sits),0],['Closed',n(log.closed),0]].filter(([,v])=>v>0).map(([l,v])=>(

}

function PipelineTab({deals,roster}){
  const now=new Date();now.setHours(23,59,59,999);
  const active=deals.filter(d=>!d.cancelled);
  const [viewMode,setViewMode]=useState('week'); // 'week' | 'alltime'
  const [weekOffset,setWeekOffset]=useState(0); // 0=this week, -1=last week, etc

  const getMonday=(offset=0)=>{
    const d=new Date(),dow=d.getDay(),m=new Date(d);
    m.setDate(d.getDate()-(dow===0?6:dow-1)+(offset*7));
    m.setHours(0,0,0,0);return m;
  };
  const weekStart=getMonday(weekOffset);
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);weekEnd.setHours(23,59,59,999);

  const reps=repList(roster);
  const repWeekNTP={},repWeekInst={},repAllNTP={},repAllInst={},repEarnings={};
  reps.forEach(n=>{repWeekNTP[n]=0;repWeekInst[n]=0;repAllNTP[n]=0;repAllInst[n]=0;repEarnings[n]=0;});
  active.forEach(d=>{
    const entryDt=new Date(d.entryDate);
    const instDt=d.installDate?new Date(d.installDate):null;
    const inWeekNTP=entryDt>=weekStart&&entryDt<=weekEnd;
    const installed=instDt&&instDt<=now;
    const inWeekInst=installed&&instDt>=weekStart&&instDt<=weekEnd;
    [d.setter,d.closer].filter((n,i,a)=>n&&repWeekNTP[n]!=null&&(i===0||n!==d.setter)).forEach((n,i)=>{
      if(inWeekNTP)repWeekNTP[n]++;
      if(inWeekInst)repWeekInst[n]++;
      repAllNTP[n]++;
      if(installed)repAllInst[n]++;
      repEarnings[n]+=i===0?(d.result?.sNet||0):(d.result?.cNet||0);
    });
  });

  const cancelledDeals=deals.filter(d=>d.cancelled);
const scoreboard=reps.map(n=>({
    name:n,
    ntp:viewMode==='week'?repWeekNTP[n]:repAllNTP[n],
    installs:viewMode==='week'?repWeekInst[n]:repAllInst[n],
    earnings:repEarnings[n],
    cancelRate:(()=>{const tot=active.filter(d=>d.setter===n||d.closer===n).length+cancelledDeals.filter(d=>d.setter===n||d.closer===n).length;return tot>0?Math.round((cancelledDeals.filter(d=>d.setter===n||d.closer===n).length/tot)*100):0;})()
  })).sort((a,b)=>b.ntp-a.ntp||b.installs-a.installs);

  const maxNTP=scoreboard.reduce((m,r)=>Math.max(m,r.ntp),1);
  const medals=['🥇','🥈','🥉'];
  const pending=active.filter(d=>!d.installDate||new Date(d.installDate)>now);
  const withDate=pending.filter(d=>d.installDate).sort((a,b)=>new Date(a.installDate)-new Date(b.installDate));
  const noDate=pending.filter(d=>!d.installDate);
  const daysSince=d=>Math.floor((now-new Date(d.entryDate))/(1000*60*60*24));

  const weekLabel=weekOffset===0?'This week':weekOffset===-1?'Last week':Math.abs(weekOffset)+' weeks ago';

  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{...card,border:'1px solid '+C.indigo+'30'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}}>
        <Label>{viewMode==='week'?weekLabel+' — NTP & installs':'All time — NTP & installs'}</Label>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          {viewMode==='week'&&<button onClick={()=>setWeekOffset(p=>p-1)} style={{width:28,height:28,borderRadius:7,border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-secondary)',color:'var(--color-text-primary)',fontSize:14,cursor:'pointer',fontWeight:700}}>‹</button>}
          {viewMode==='week'&&<span style={{fontSize:11,color:'var(--color-text-tertiary)',minWidth:120,textAlign:'center'}}>{weekStart.toLocaleDateString()+' – '+weekEnd.toLocaleDateString()}</span>}
          {viewMode==='week'&&weekOffset<0&&<button onClick={()=>setWeekOffset(p=>Math.min(0,p+1))} style={{width:28,height:28,borderRadius:7,border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-secondary)',color:'var(--color-text-primary)',fontSize:14,cursor:'pointer',fontWeight:700}}>›</button>}
          {viewMode==='week'&&weekOffset===0&&<div style={{width:28}}/>}
          <div style={{display:'flex',borderRadius:8,overflow:'hidden',border:'0.5px solid var(--color-border-secondary)'}}>
            {[['week','Week'],['alltime','All Time']].map(([v,l])=>(
              <button key={v} onClick={()=>setViewMode(v)} style={{padding:'5px 12px',border:'none',background:viewMode===v?C.indigo:'var(--color-background-secondary)',color:viewMode===v?'white':'var(--color-text-secondary)',fontSize:11,fontWeight:700,cursor:'pointer'}}>{l}</button>
            ))}
          </div>
        </div>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:20,marginBottom:8,fontSize:11,fontWeight:700,paddingRight:10}}>
        <span style={{color:C.indigo,width:32,textAlign:'right'}}>NTP</span>
        <span style={{color:C.emerald,width:32,textAlign:'right'}}>Inst.</span>
        <span style={{color:C.red,width:38,textAlign:'right'}}>Cncl%</span>
        <span style={{color:C.amber,width:70,textAlign:'right'}}>{viewMode==='week'?'Earnings':'All $ earned'}</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:3}}>
        {scoreboard.map((rep,i)=>{
          const top=i<3&&rep.ntp>0;
          return <div key={rep.name} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 10px',borderRadius:8,background:top?C.indigoL:'transparent'}}>
            <div style={{width:22,textAlign:'center',flexShrink:0}}>
              {top?<span style={{fontSize:13}}>{medals[i]}</span>:<span style={{fontSize:11,fontWeight:700,color:'var(--color-text-tertiary)'}}>{'#'+(i+1)}</span>}
            </div>
            <div style={{width:80,flexShrink:0,fontSize:13,fontWeight:700,color:top?C.indigoD:'var(--color-text-primary)'}}>{rep.name}</div>
            <div style={{flex:1}}>
              <div style={{height:5,background:'var(--color-background-secondary)',borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',width:(rep.ntp/maxNTP*100)+'%',background:top?C.indigo:C.slate,borderRadius:3}}/>
              </div>
            </div>
            <span style={{fontSize:14,fontWeight:900,color:rep.ntp>0?C.indigo:'var(--color-text-tertiary)',width:32,textAlign:'right'}}>{rep.ntp}</span>
            <span style={{fontSize:14,fontWeight:900,color:rep.installs>0?C.emerald:'var(--color-text-tertiary)',width:32,textAlign:'right'}}>{rep.installs}</span>
            <span style={{fontSize:12,fontWeight:700,color:rep.allTime>0?C.amber:'var(--color-text-tertiary)',width:70,textAlign:'right'}}>{rep.allTime>0?FMT(rep.allTime):'—'}</span>
          </div>;
        })}
      </div>
    </div>

    <div style={card}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <Label>{'Install pipeline ('+pending.length+' deals pending)'}</Label>
        {noDate.length>0&&<span style={{fontSize:11,color:C.amber,fontWeight:700}}>{noDate.length+' missing install date'}</span>}
      </div>
      {pending.length===0&&<div style={{textAlign:'center',padding:'20px',color:'var(--color-text-tertiary)',fontSize:13}}>All NTP deals have installed.</div>}
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {withDate.map(d=>{
          const daysNTP=daysSince(d);
          const daysToInstall=Math.round((new Date(d.installDate)-now)/(1000*60*60*24));
          const overdue=daysNTP>30;
          const soon=daysToInstall>=0&&daysToInstall<=7;
          return <div key={d.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:9,background:overdue?C.redL:soon?C.emeraldL:'var(--color-background-secondary)',border:'1px solid '+(overdue?C.red:soon?C.emerald:'transparent')+'30'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--color-text-primary)'}}>{d.setter+' + '+d.closer}</div>
              <div style={{fontSize:11,color:'var(--color-text-tertiary)'}}>{(d.result?.W?((d.result.W/1000).toFixed(1)+'kW · '):'')+FMT(d.result?.rev||0)+(d.notes?' · '+d.notes:'')}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:12,fontWeight:700,color:overdue?C.red:soon?C.emerald:'var(--color-text-primary)'}}>{'Install '+d.installDate}</div>
              <div style={{fontSize:11,color:overdue?C.red:soon?C.emeraldD:'var(--color-text-tertiary)'}}>
                {overdue?('NTP '+daysNTP+'d ago — OVERDUE'):soon?('In '+daysToInstall+'d'):('NTP '+daysNTP+'d ago')}
              </div>
            </div>
          </div>;
        })}
        {noDate.map(d=>{
          const daysNTP=daysSince(d);
          const late=daysNTP>30;
          return <div key={d.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:9,background:late?C.redL:'var(--color-background-secondary)',border:'1px solid '+(late?C.red:'transparent')+'30'}}>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--color-text-primary)'}}>{d.setter+' + '+d.closer}</div>
              <div style={{fontSize:11,color:'var(--color-text-tertiary)'}}>{(d.result?.W?((d.result.W/1000).toFixed(1)+'kW · '):'')+FMT(d.result?.rev||0)}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:12,color:late?C.red:'var(--color-text-tertiary)',fontWeight:late?700:400}}>No install date</div>
              <div style={{fontSize:11,color:late?C.red:'var(--color-text-tertiary)'}}>{'NTP '+daysNTP+'d ago'+(late?' — set a date!':'')}</div>
            </div>
          </div>;
        })}
      </div>
    </div>

    <div style={card}>
      <Label>All-time rep earnings</Label>
      <div style={{display:'flex',flexDirection:'column',gap:3}}>
        {reps.map(n=>({name:n,earned:repEarnings[n]||0})).sort((a,b)=>b.earned-a.earned).map((rep,i)=>{
          const top=i<3&&rep.earned>0;
          return <div key={rep.name} style={{display:'flex',alignItems:'center',gap:10,padding:'6px 10px',borderRadius:7,background:top?C.amberL:'transparent'}}>
            <div style={{width:22,textAlign:'center',flexShrink:0}}>
              {top?<span style={{fontSize:13}}>{medals[i]}</span>:<span style={{fontSize:11,color:'var(--color-text-tertiary)'}}>{'#'+(i+1)}</span>}
            </div>
            <div style={{width:80,flexShrink:0,fontSize:13,fontWeight:700,color:top?C.gold:'var(--color-text-primary)'}}>{rep.name}</div>
            <div style={{flex:1}}>
              <div style={{height:5,background:'var(--color-background-secondary)',borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',width:Math.min(100,(rep.earnings||0)/Math.max(1,...scoreboard.map(r=>r.earnings||0))*100)+'%',background:top?C.amber:C.slate,borderRadius:3}}/>
              </div>
            </div>
            <span style={{fontSize:13,fontWeight:800,color:top?C.gold:rep.earned>0?'var(--color-text-primary)':'var(--color-text-tertiary)',width:72,textAlign:'right'}}>{rep.earned>0?FMT(rep.earned):'—'}</span>
          </div>;
        })}
      </div>
    </div>
  </div>;
}

        {[{rk:'setter',tk:'setterTeam',c:C.blue,title:'Setter'},{rk:'closer',tk:'closerTeam',c:C.purple,title:'Closer'}].map(({rk,tk,c,title})=>(

              <span>{'Installed: '+(roster[form[rk]].fundedDeals||0)}</span>

                  <option value="Custom">Custom...</option>

                  <span style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',color:'var(--color-text-tertiary)',fontSize:13,pointerEvents:'none'}}>$</span>
                  <input value={a.amount} onChange={e=>upAdder(i,'amount',e.target.value)} type="number" placeholder="0"
                    style={{width:'100%',boxSizing:'border-box',paddingLeft:20,paddingRight:8,paddingTop:7,paddingBottom:7,background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:8,fontSize:13,color:'var(--color-text-primary)',outline:'none'}}/>
                </div>
                <button onClick={()=>rmAdder(i)} style={{background:'transparent',border:'none',cursor:'pointer',color:'var(--color-text-tertiary)',fontSize:20,lineHeight:1,padding:'0 4px'}}>×</button>
              </div>
              {isCustom&&<input value={a.cname||''} onChange={e=>upAdder(i,'cname',e.target.value)} placeholder="Custom adder name..."
                style={{fontSize:13,padding:'7px 10px',background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:8,color:'var(--color-text-primary)',outline:'none'}}/>}
            </div>;

        {r&&r.adderTotal>0&&<div style={{display:'flex',justifyContent:'space-between',marginTop:10,paddingTop:10,borderTop:'0.5px solid var(--color-border-tertiary)',fontSize:13}}>
          <span style={{color:'var(--color-text-secondary)'}}>Total adders</span>
          <span style={{fontWeight:700,color:C.red}}>{FMT(r.adderTotal)}</span>
        </div>}
      </div>

      <div>
        <label style={lbl}>Notes</label>
        <textarea value={form.notes} onChange={e=>u('notes',e.target.value)} placeholder="Customer name, address, notes..." rows={2}
          style={{width:'100%',boxSizing:'border-box',resize:'none',padding:'8px 12px',background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:10,color:'var(--color-text-primary)',fontSize:14,outline:'none'}}/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <Btn onClick={onSave} disabled={!ok} variant="success" full>
          {autoExportStatus==='exporting'?'Saving + syncing to Sheets...':saved?'Saved!':'Save deal'}
        </Btn>
        {autoExportStatus==='done'&&<div style={{fontSize:12,textAlign:'center',color:C.emerald,fontWeight:700}}>Saved locally + synced to Google Sheets</div>}
        {autoExportStatus==='no-sheets'&&<div style={{fontSize:12,padding:'8px 12px',background:C.amberL,border:'1px solid '+C.amber,borderRadius:9,color:C.gold,fontWeight:600}}>
          Saved locally. Configure Google Sheets in the Sheets tab to auto-sync every deal.
        </div>}
        {autoExportStatus==='error'&&<div style={{fontSize:12,padding:'8px 12px',background:C.redL,border:'1px solid '+C.red,borderRadius:9,color:C.red,fontWeight:600}}>
          Saved locally. Sheets sync failed — check connection in Sheets tab.
        </div>}
      </div>
      {saved&&<Btn onClick={onNewDeal} variant="outline" full>+ New deal</Btn>}
    </div>

    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      {!r?<div style={{...card,textAlign:'center',padding:'64px 24px'}}>
        <div style={{fontSize:44,marginBottom:14}}>🧮</div>
        <div style={{color:'var(--color-text-tertiary)',fontSize:14}}>Fill in deal details to see the full commission breakdown.</div>
      </div>:<>
        {form.lightReach&&<div style={{padding:'10px 14px',borderRadius:10,border:'1px solid '+C.amber+'60',background:C.amberL,marginBottom:8}}>
          <div style={{fontSize:12,fontWeight:800,color:C.gold,marginBottom:8}}>⚡ LightReach TPO — Payment Schedule</div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
            <div style={{flex:1,minWidth:120,padding:'8px 10px',borderRadius:8,background:C.amber+'20',border:'1px solid '+C.amber+'40'}}>
              <div style={{fontSize:10,color:C.gold,fontWeight:700,marginBottom:2}}>M1 — AT INSTALL</div>
              {r.setter===r.closer?null:<div style={{fontSize:11,color:C.gold}}>Setter: <b>{FMT((r.sNet||0)/2)}</b></div>}
              {form.setter&&form.closer&&form.setter!==form.closer?<div style={{fontSize:11,color:C.gold}}>Closer: <b>{FMT((r.cNet||0)/2)}</b></div>:null}
              {form.setter===form.closer?<div style={{fontSize:11,color:C.gold}}>{form.setter}: <b>{FMT(((r.sNet||0)+(r.cNet||0))/2)}</b></div>:null}
              <div style={{fontSize:10,color:C.amber,marginTop:3}}>Total: {FMT(((r.sNet||0)+(r.cNet||0))/2)}</div>
            </div>
            <div style={{flex:1,minWidth:120,padding:'8px 10px',borderRadius:8,background:'var(--color-background-secondary)',border:'1px solid '+C.slate+'40'}}>
              <div style={{fontSize:10,color:'var(--color-text-tertiary)',fontWeight:700,marginBottom:2}}>M2 — AT PTO</div>
              {form.setter&&form.closer&&form.setter!==form.closer?<><div style={{fontSize:11,color:'var(--color-text-secondary)'}}>Setter: <b>{FMT((r.sNet||0)/2)}</b></div><div style={{fontSize:11,color:'var(--color-text-secondary)'}}>Closer: <b>{FMT((r.cNet||0)/2)}</b></div></>:<div style={{fontSize:11,color:'var(--color-text-secondary)'}}>{form.setter||form.closer}: <b>{FMT(((r.sNet||0)+(r.cNet||0))/2)}</b></div>}
              <div style={{fontSize:10,color:'var(--color-text-tertiary)',marginTop:3}}>Total: {FMT(((r.sNet||0)+(r.cNet||0))/2)}</div>
            </div>
          </div>
        </div>}
        <div style={card}><Label>Per-watt breakdown — {'$'+r.SP+'/W sale'}</Label><PPWBar r={r} form={form}/></div>

        <div style={card}>
          <Label>Rep payouts</Label>
          {r.SR!==r.CR&&<div style={{marginBottom:10,padding:'9px 12px',background:C.amberL,border:'1px solid '+C.amber,borderRadius:10,fontSize:12,color:C.gold}}>
            {'Mixed redlines: '+form.setter+' $'+r.SR+(r.SR===2.40?' \u2605':'')+' · '+form.closer+' $'+r.CR+(r.CR===2.40?' \u2605':'')+'. Ascend takes extra '+FMT(r.rldiff)+' ($'+((r.rldiff/r.W).toFixed(2))+'/W) from the $'+r.maxRL+' rep.'}
          </div>}
          <PayRow label={form.setter+' (setter)'} ppwR={r.sBase/r.W} base={r.sBase} net={r.sNet} deduct={r.dd.s} color={C.blue}/>
          <PayRow label={form.closer+' (closer)'} ppwR={r.cBase/r.W} base={r.cBase} net={r.cNet} deduct={r.dd.c} color={C.purple}/>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:8,paddingTop:8,borderTop:'0.5px solid var(--color-border-tertiary)',fontSize:13}}>
            <span style={{color:'var(--color-text-secondary)'}}>Combined rep take</span>
            <span style={{fontWeight:700}}>{FMT(r.sNet+r.cNet)}</span>
          </div>
        </div>

        <div style={card}>
          <Label>Manager & director payouts</Label>
          <PayRow label="Ty Cali" ppwR={null} base={r.tyCalib} net={r.tyCalinet} deduct={r.dd.tc||0} color="#0e7490" sub="Tech — flat $150 every deal"/>
          {r.tylerB>0&&<PayRow label="Tyler" ppwR={0.10} base={r.tylerB} net={r.tylerNet} deduct={r.dd.t} color={C.orange} sub="$0.10/W — rep on his team"/>}
          {r.jimB>0&&<PayRow label="Jim" ppwR={null} base={r.jimB} net={r.jimNet} deduct={r.dd.j||0} color="#0891b2" sub="Flat $150 — Tyler active"/>}
          {r.larisaTB>0&&<>
            <PayRow label="Larissa (Blitz)" ppwR={r.lPPW-r.jPPW} base={r.larisaB} net={r.larisaNet} deduct={r.dd.l*(r.larisaB/(r.larisaTB||1))} color={C.pink}/>
            <PayRow label="Jermaine — 25% of Larissa" ppwR={r.jPPW} base={r.jermaineB} net={r.jermaineNet} deduct={r.dd.l*(r.jermaineB/(r.larisaTB||1))} color="#f43f5e" sub="Senior Director override"/>
          </>}
        </div>

        {r.recTotal>0&&<div style={card}>
          <Label>Recruit overrides</Label>
          {Object.entries(r.recMap).map(([name,amt])=>(
            <PayRow key={name} label={name} ppwR={0.01} base={amt} net={amt} color={C.amber} sub="$0.01/W per qualifying recruit"/>
          ))}
        </div>}

        {r.adderTotal>0&&<div style={{...card,border:'1px solid '+C.red+'30'}}>
          <Label c={C.red}>{'Adder waterfall — '+FMT(r.adderTotal)+' total'}</Label>
          <div style={{display:'flex',flexDirection:'column',gap:2,marginBottom:10}}>
            {r.adders.map((a,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'4px 0',borderBottom:'0.5px solid var(--color-border-tertiary)'}}>
              <span style={{color:'var(--color-text-secondary)'}}>{a.name==='Custom'?a.cname:a.name||a.cname||'—'}</span>
              <span style={{color:C.red,fontWeight:500}}>{FMT(parseFloat(a.amount||0))}</span>
            </div>)}
          </div>
          {[r.dd.s>.005&&['From '+form.setter,r.dd.s,C.blue],r.dd.c>.005&&['From '+form.closer,r.dd.c,C.purple],(r.dd.t+r.dd.j+r.dd.tc+r.dd.l)>.005&&['From managers',r.dd.t+r.dd.j+r.dd.tc+r.dd.l,C.orange],r.dd.a>.005&&['From Ascend',r.dd.a,C.emerald]].filter(Boolean).map(([l,v,c],i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 0'}}>
              <span style={{color:'var(--color-text-secondary)'}}>{'← '+l}</span>
              <span style={{color:c,fontWeight:500}}>{FMT(v)}</span>
            </div>
          ))}
        </div>}

        <div style={{...card,border:'1.5px solid '+C.emerald+'40'}}>
          <Label>Ascend summary</Label>
          <div style={{display:'flex',flexDirection:'column',gap:7}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:14}}><span style={{color:'var(--color-text-secondary)'}}>Gross margin</span><span>{FMT(r.ascGross)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Tyler ($0.10/W)'}</span><span>{FMT(r.tylerB)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Jim (flat)'}</span><span>{FMT(r.jimB)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Ty Cali (tech)'}</span><span>{FMT(r.tyCalib)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Ty Cali (tech $150)'}</span><span>{FMT(r.tyCalib||0)}</span></div>
            {r.larisaTB>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Larissa + Jermaine'}</span><span>{FMT(r.larisaTB)}</span></div>}
            {r.recTotal>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Recruit overrides'}</span><span>{FMT(r.recTotal)}</span></div>}
            {r.dd.a>.005&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--color-text-tertiary)'}}><span>{'- Adder overflow'}</span><span>{FMT(r.dd.a)}</span></div>}
            <div style={{display:'flex',justifyContent:'space-between',fontSize:16,fontWeight:800,paddingTop:10,borderTop:'1px solid '+C.emerald+'40'}}>
              <span style={{color:C.emerald}}>Net profit</span>
              <span style={{color:r.ascProfit>=0?C.emerald:C.red}}>{FMT(r.ascProfit)}</span>
            </div>
          </div>
        </div>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 14px',borderRadius:10,border:'1px solid '+(r.ok?C.emerald:C.red)+'50',background:r.ok?C.emeraldL:C.redL,fontSize:12}}>
          <span style={{color:r.ok?C.emeraldD:C.red,fontWeight:700}}>{r.ok?'All dollars accounted for':'Calculation mismatch — check inputs'}</span>
          <span style={{color:'var(--color-text-tertiary)'}}>{FMT(r.verify)+' / '+FMT(r.rev)}</span>
        </div>
      </>}
    </div>
  </div>;
}

function HistoryTab({deals,setDeals,roster}){
  const reps=repList(roster);
  const [q,setQ]=useState('');
  const [filter,setFilter]=useState('all');
  const [editId,setEditId]=useState(null);
  const [editForm,setEditForm]=useState({});
  const filt=deals.filter(d=>{
    const sq=q.toLowerCase();
    const mq=!sq||(d.setter||'').toLowerCase().includes(sq)||(d.closer||'').toLowerCase().includes(sq)||(d.notes||'').toLowerCase().includes(sq)||(d.installDate||'').includes(sq)||(d.entryDate||'').includes(sq)||((d.result?.W||0)/1000).toFixed(1).includes(sq);
    const mf=filter==='all'||(filter==='active'&&!d.cancelled)||(filter==='cancelled'&&d.cancelled)||(filter==='ntp'&&d.ntp&&!d.cancelled);
    return mq&&mf;
  });
  const toggle=(id,key)=>setDeals(p=>p.map(d=>d.id===id?{...d,[key]:!d[key]}:d));
  const m2Pending=deals.filter(d=>d.lightReach&&!d.ptoDate&&!d.cancelled&&d.installDate&&new Date(d.installDate)<=new Date());
  const m2Total=m2Pending.reduce((s,d)=>{
    const sAmt=(d.result?.sNet||0)/2;
    const cAmt=d.setter!==d.closer?(d.result?.cNet||0)/2:0;
    return s+sAmt+cAmt;
  },0);
  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    {m2Pending.length>0&&<div style={{padding:'12px 16px',borderRadius:12,border:'1px solid '+C.amber+'60',background:C.amberL,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
      <div>
        <div style={{fontSize:13,fontWeight:800,color:C.gold}}>⚡ LightReach M2 — Awaiting PTO</div>
        <div style={{fontSize:11,color:C.amber,marginTop:2}}>Commissions earned but not yet paid — mark PTO on each deal below when utility approves</div>
      </div>
      <div style={{textAlign:'right'}}>
        <div style={{fontSize:24,fontWeight:900,color:C.amber}}>{FMT(m2Total)}</div>
        <div style={{fontSize:10,color:C.gold,fontWeight:700}}>{m2Pending.length+' deal'+(m2Pending.length!==1?'s':'')+' pending PTO'}</div>
      </div>
    </div>}
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search rep, date (2026-05), size (10.5)..."
        style={{flex:1,minWidth:180,padding:'8px 12px',background:'var(--color-background-secondary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:10,color:'var(--color-text-primary)',fontSize:14,outline:'none'}}/>
      <div style={{display:'flex',gap:4}}>
        {[['all','All'],['active','Active'],['ntp','NTP ✓'],['cancelled','Cancelled']].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{padding:'7px 14px',borderRadius:8,border:'none',fontSize:13,fontWeight:700,cursor:'pointer',background:filter===v?C.indigo:'var(--color-background-secondary)',color:filter===v?'white':'var(--color-text-secondary)'}}>
            {l}
          </button>
        ))}
      </div>
      <span style={{fontSize:12,color:'var(--color-text-tertiary)',whiteSpace:'nowrap'}}>{deals.length+' total'}</span>
    </div>
    {filt.length===0&&<div style={{...card,textAlign:'center',padding:'48px 20px',color:'var(--color-text-tertiary)',fontSize:14}}>
      {deals.length===0?'No deals yet. Enter your first NTP in the Calculator tab.':'No results.'}
    </div>}
    {filt.map(d=>{const r=d.result;if(!r)return null;
      const isEditing=editId===d.id;
      return <div key={d.id} style={{...card,opacity:d.cancelled?0.65:1,borderLeft:'4px solid '+(d.ntp?C.emerald:d.cancelled?C.red:C.slate)}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{fontWeight:700,fontSize:15,color:'var(--color-text-primary)'}}>{d.setter+' + '+d.closer}</span>
              {d.lightReach&&<span style={{fontSize:10,fontWeight:800,padding:'2px 7px',borderRadius:6,background:C.amberL,color:C.gold}}>⚡ LR</span>}
            </div>
            <div style={{fontSize:12,color:'var(--color-text-tertiary)',marginTop:2,display:'flex',gap:8,flexWrap:'wrap'}}>
              <span>{'Entered '+new Date(d.entryDate).toLocaleDateString()}</span>
              {d.installDate&&<span>{'Install '+d.installDate}</span>}
              {d.ntp&&<span style={{color:C.emerald,fontWeight:700}}>{'NTP '+(d.ntpDate||'✓')}</span>}
            </div>
          </div>
          {d.cancelled&&<Pill bg={C.redL} color={C.red}>Cancelled</Pill>}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',justifyContent:'flex-end'}}>
          <button onClick={()=>{
            const now=new Date().toISOString().slice(0,10);
            setDeals(p=>p.map(x=>x.id===d.id?{...x,ntp:!d.ntp,ntpDate:!d.ntp?now:null}:x));
          }} style={{fontSize:11,fontWeight:700,padding:'4px 9px',borderRadius:7,border:'1px solid '+(d.ntp?C.slate:C.emerald),background:d.ntp?'transparent':C.emerald+'20',color:d.ntp?C.slate:C.emerald,cursor:'pointer',whiteSpace:'nowrap'}}>
            {d.ntp?'NTP ✓':'Mark NTP'}
          </button>
          {d.lightReach&&<button onClick={()=>{
            const now=new Date().toISOString().slice(0,10);
            setDeals(p=>p.map(x=>x.id===d.id?{...x,ptoDate:x.ptoDate?null:now}:x));
          }} style={{fontSize:11,fontWeight:700,padding:'4px 9px',borderRadius:7,border:'1px solid '+(d.ptoDate?C.amber:C.gold),background:d.ptoDate?C.amberL:'transparent',color:d.ptoDate?C.gold:C.gold,cursor:'pointer',whiteSpace:'nowrap'}}>
            {d.ptoDate?('PTO ✓ '+d.ptoDate):'Mark PTO'}
          </button>}
          <button onClick={()=>{setEditId(isEditing?null:d.id);setEditForm({installDate:d.installDate||'',notes:d.notes||'',size:d.size||'',ppw:d.ppw||''});}} style={{fontSize:11,fontWeight:700,padding:'4px 9px',borderRadius:7,border:'1px solid '+C.indigo,background:isEditing?C.indigo:'transparent',color:isEditing?'white':C.indigo,cursor:'pointer'}}>
            {isEditing?'Close':'Edit'}
          </button>
          <button onClick={()=>toggle(d.id,'cancelled')} style={{fontSize:11,fontWeight:700,padding:'4px 9px',borderRadius:7,border:'1px solid '+(d.cancelled?C.emerald:C.red),background:'transparent',color:d.cancelled?C.emerald:C.red,cursor:'pointer'}}>
            {d.cancelled?'Restore':'Cancel'}
          </button>
          <button onClick={()=>{if(window.confirm('Delete this deal?'))setDeals(p=>p.filter(x=>x.id!==d.id));}} style={{background:'transparent',border:'none',cursor:'pointer',color:'var(--color-text-tertiary)',fontSize:16,padding:'2px 6px'}}>×</button>
        </div>
      </div>

}


function RosterTab({roster,setRoster,deals,activity,installedCounts}){

  const activeDeal=deals.filter(d=>!d.cancelled);
  const cc={green:{bg:C.emeraldL,txt:C.emeraldD,bar:C.emerald},yellow:{bg:C.amberL,txt:C.gold,bar:C.amber},orange:{bg:'#fff7ed',txt:C.orange,bar:C.orange},red:{bg:C.redL,txt:C.red,bar:C.red}};
  const reps=repList(roster);
  const [newRepName,setNewRepName]=useState('');

  const removeRep=name=>{if(!window.confirm('Remove '+name+'? Historical deal data is kept.'))return;setRoster(p=>{const n={...p};delete n[name];return n;});};
  const fastStartCount=(name,deadline)=>{
    if(!deadline)return 0;
    const dl=new Date(deadline);dl.setHours(23,59,59,999);
    const fromDeals=activeDeal.filter(d=>(d.setter===name||d.closer===name)&&new Date(d.entryDate)<=dl).length;
    const manual=(roster[name]||{}).manualNTP||0;
    return fromDeals+manual;
  };

    </div>
    <div style={{padding:'10px 14px',background:C.indigoL,borderRadius:10,fontSize:12,color:C.indigoD,display:'flex',gap:14,flexWrap:'wrap',alignItems:'center',border:'1px solid '+C.indigo+'30'}}>
      <span style={{fontWeight:700}}>Roster</span>

      <span style={{color:C.gold,fontWeight:700}}>Golden Door: 150 pts (1 per install).</span>

      const recruiters=[...new Set(repList(roster).filter(n=>(roster[n]||{}).recruiter).map(n=>roster[n].recruiter))].sort();

          {recruiters.map(rec=>{
            const recruits=repList(roster).filter(n=>(roster[n]||{}).recruiter===rec);
            const totalInstalls=recruits.reduce((s,n)=>s+active.filter(d=>(d.setter===n||d.closer===n)&&d.installDate&&new Date(d.installDate)<=today).length,0);
            const totalClosed=recruits.reduce((s,n)=>s+active.filter(d=>d.setter===n||d.closer===n).length,0);
            const logs=recruits.flatMap(n=>(activity||[]).filter(a=>a.rep===n));
            const totalBills=logs.reduce((s,a)=>s+(parseInt(a.bills)||0),0);

function AscendApp(){
  const [view,setView]=useState('goals');
  const [roster,setRoster]=useState(mkRoster);
  const [deals,setDeals]=useState([]);
  const [form,setForm]=useState(EMPTY_FORM);
  const [activity,setActivity]=useState([]);
  const [sheets,setSheets]=useState({clientId:'',spreadsheetId:''});
  const [tok,setTok]=useState(null);
  const [expMsg,setExpMsg]=useState('');
  const [saved,setSaved]=useState(false);
  const [sheetsWarning,setSheetsWarning]=useState(false);
  const [autoExportStatus,setAutoExportStatus]=useState('');
  const [congrats,setCongrats]=useState(null);
  const [showAdmin,setShowAdmin]=useState(false);
  const [wagers,setWagers]=useState([]);
  const [incentives,setIncentives]=useState([]);
  const [customStore,setCustomStore]=useState([]);
  const [standards,setStandards]=useState({knocks:100,pitches:8,bills:1,sits:4});

  const lastEdit=React.useRef(0);window._ascLastEdit=lastEdit;
  const loadData=async()=>{
    if(Date.now()-lastEdit.current<5000)return;
    try{
      const [r,d,s,ac,wg,inc,cs,st]=await Promise.all([
        db.getRoster(),db.getDeals(),db.getSheets(),db.getActivity(),
        db.get('asc_wagers'),db.get('asc_incentives'),db.get('asc_store'),db.get('asc_standards')
      ]);
      if(r)setRoster(r);else setRoster(p=>p||mkRoster());
      if(d&&d.length)setDeals(d);
      if(s)setSheets(s);
      if(ac&&ac.length)setActivity(ac);
      if(wg)setWagers(wg);
      if(inc)setIncentives(inc);
      if(cs&&cs.length)setCustomStore(cs);
      if(st)setStandards(st);
    }catch(e){setRoster(p=>p||mkRoster());}
  };
  const isLoading=React.useRef(true);
  useEffect(()=>{
    loadData().then(()=>{isLoading.current=false;});
    const iv=setInterval(()=>{
      if(!isLoading.current)loadData();
    },60000);
    return()=>clearInterval(iv);
  },[]);

  useEffect(()=>{
    if(isLoading.current)return;
    const t=setTimeout(()=>db.setRoster(roster),800);
    return()=>clearTimeout(t);
  },[roster]);
  useEffect(()=>{if(!isLoading.current&&deals.length){const t=setTimeout(()=>db.setDeals(deals),800);return()=>clearTimeout(t);}},[deals]);
  useEffect(()=>{if(!isLoading.current&&activity.length){const t=setTimeout(()=>db.setActivity(activity),800);return()=>clearTimeout(t);}},[activity]);
  useEffect(()=>{if(!isLoading.current&&sheets){const t=setTimeout(()=>db.setSheets(sheets),800);return()=>clearTimeout(t);}},[sheets]);

  const installedCounts=useMemo(()=>{
    const today=new Date();today.setHours(23,59,59,999);
    const counts={};
    repList(roster).forEach(n=>{
      const fromDeals=deals.filter(d=>!d.cancelled&&(d.setter===n||d.closer===n)&&d.installDate&&new Date(d.installDate)<=today).length;
      counts[n]=fromDeals+(roster[n]?roster[n].manualInstalls||0:0);
    });
    return counts;
  },[deals,roster]);
  const ntpCounts=useMemo(()=>{
    const counts={};
    repList(roster).forEach(n=>{
      // Count deals explicitly marked NTP, OR all active deals if none are marked NTP yet
      const ntpMarked=deals.filter(d=>!d.cancelled&&d.ntp&&(d.setter===n||d.closer===n)).length;
      const allActive=deals.filter(d=>!d.cancelled&&(d.setter===n||d.closer===n)).length;
      // If rep has no NTP-marked deals, fall back to all active (graceful for existing data)
      const fromDeals=ntpMarked>0?ntpMarked:allActive;
      counts[n]=fromDeals+(roster[n]?roster[n].manualNTP||0:0);
    });
    return counts;
  },[deals,roster]);
  const result=useMemo(()=>{if(!roster)return null;try{return calcDeal(form,roster,installedCounts)}catch(e){return null}},[form,roster,installedCounts]);

  const [saving,setSaving]=useState(false);
  const onSave=useCallback(async()=>{
    if(saving)return;
    setSaving(true);
    if(!result||!form.setter||!form.closer)return;
    const deal={id:Date.now().toString(),entryDate:new Date().toISOString(),cancelled:false,...form,ptoDate:null,result};
    setDeals(p=>[deal,...p]);
    setSaved(true);setSaving(false);setTimeout(()=>setSaved(false),4000);
    // Single setRoster call: installed deals + token awards
    const todayCheck=new Date();todayCheck.setHours(23,59,59,999);
    const isInstalled=form.installDate&&new Date(form.installDate)<=todayCheck;
    const baseAmt=TOKEN_RATES.ntp+(isInstalled?TOKEN_RATES.install:0);
    setRoster(prev=>{
      const upd={...prev};
      // Installed deals
      if(upd[form.setter])upd[form.setter]={...upd[form.setter],fundedDeals:(upd[form.setter].fundedDeals||0)+1};
      if(upd[form.closer]&&form.closer!==form.setter)upd[form.closer]={...upd[form.closer],fundedDeals:(upd[form.closer].fundedDeals||0)+1};
      // Token awards
      [form.setter,form.closer].filter(Boolean).filter((n,i,a)=>a.indexOf(n)===i).forEach(name=>{
        const rep=upd[name]||{};
        const prevEarned=rep.totalEarned||0;
        const newEarned=prevEarned+baseAmt;
        const prevLvl=getLevelInfo(prevEarned);
        const newLvl=getLevelInfo(newEarned);
        upd[name]={...rep,tokens:(rep.tokens||0)+baseAmt,totalEarned:newEarned};
        if(prevLvl.name!==newLvl.name){
          setCongrats({rep:name,emoji:newLvl.icon,message:'LEVEL UP!',sub:name+' is now '+newLvl.name,color:newLvl.color,tokens:baseAmt});
          setTimeout(()=>setCongrats(null),6000);
        }
      });
      return upd;
    });
    // Award NTP tokens to setter and closer
    if(form.setter)onAwardTokens(form.setter,TOKEN_RATES.ntp,'sale');
    if(form.closer!==form.setter)onAwardTokens(form.closer,TOKEN_RATES.ntp,'sale');
    // Award install tokens if installDate already passed
    const instDt=form.installDate?new Date(form.installDate):null;
    if(instDt&&instDt<=new Date()){
      onAwardTokens(form.setter,TOKEN_RATES.install,'install');
      if(form.closer!==form.setter)onAwardTokens(form.closer,TOKEN_RATES.install,'install');
    }
    // Auto-export to Google Sheets
    if(!sheets.spreadsheetId||!sheets.clientId){
      setAutoExportStatus('no-sheets');
      setTimeout(()=>setAutoExportStatus(''),6000);
      return;
    }
    setAutoExportStatus('exporting');
    try{
      let t=tok;
      if(!t){t=await getToken(sheets.clientId);setTok(t);}
      const hasHdr=await getCell(t,sheets.spreadsheetId);
      if(!hasHdr)await appendSheet(t,sheets.spreadsheetId,HDR);
      await appendSheet(t,sheets.spreadsheetId,buildRow(form,result,roster||{},false));
      setAutoExportStatus('done');
    }catch(e){
      setAutoExportStatus('error');
      setTok(null);
    }
    setTimeout(()=>setAutoExportStatus(''),6000);
  },[result,form,roster,sheets,tok]);

  const onNewDeal=useCallback(()=>{setForm(EMPTY_FORM);setSaved(false);},[]);
  const onAwardTokens=useCallback((name,amount,reason,extraCongrats)=>{
    setRoster(p=>{
      const rep=p[name]||{};
      const prevEarned=rep.totalEarned||0;
      const newEarned=prevEarned+amount;
      const prevLvl=getLevelInfo(prevEarned);
      const newLvl=getLevelInfo(newEarned);
      if(newLvl.level>prevLvl.level){
        setTimeout(()=>setCongrats({rep:name,emoji:newLvl.emoji,message:'LEVEL UP!',sub:'Now a '+newLvl.name,color:newLvl.color,tokens:amount}),300);
      } else if(extraCongrats){
        setTimeout(()=>setCongrats({...extraCongrats,rep:name,tokens:amount}),300);
      }
      return{...p,[name]:{...rep,tokens:(rep.tokens||0)+amount,totalEarned:newEarned}};
    });
  },[]);


  const downloadCSV=useCallback(()=>{
    if(deals.length===0)return;
    const rows=deals.map(d=>buildRow(d,d.result||{},roster||{},d.cancelled||false));
    const escape=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const csv=[HDR,...rows].map(r=>r.map(escape).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='ascend-backup-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },[deals,roster]);


  const onExport=useCallback(async()=>{
    if(!result)return;
    if(!sheets.spreadsheetId){setExpMsg('Set Sheet ID in Sheets tab');setTimeout(()=>setExpMsg(''),4000);return;}
    let t=tok;
    if(!t){
      if(!sheets.clientId){setExpMsg('Configure Sheets tab first');setTimeout(()=>setExpMsg(''),4000);return;}
      try{t=await getToken(sheets.clientId);setTok(t);}catch(e){setExpMsg('Auth failed');setTimeout(()=>setExpMsg(''),4000);return;}
    }
    setExpMsg('Exporting...');
    try{
      const hasHdr=await getCell(t,sheets.spreadsheetId);
      if(!hasHdr)await appendSheet(t,sheets.spreadsheetId,HDR);
      await appendSheet(t,sheets.spreadsheetId,buildRow(form,result,roster||{},false));
      setExpMsg('Exported!');
    }catch(e){setExpMsg('Error: '+e.message.slice(0,24));setTok(null);}
    setTimeout(()=>setExpMsg(''),5000);
  },[result,form,roster,sheets,tok]);

  const activeDeals=deals.filter(d=>!d.cancelled);
  const todayH=new Date();todayH.setHours(23,59,59,999);
  const todayH2=new Date();todayH2.setHours(23,59,59,999);
  const installedCount=activeDeals.filter(d=>d.installDate&&new Date(d.installDate)<=todayH2).length;
  const installPct=Math.min(100,(installedCount/GOAL)*100);

            {tabs.map(([v,l])=><button key={v} onClick={()=>setView(v)} style={{padding:'6px 10px',borderRadius:8,border:'none',fontWeight:700,fontSize:12,cursor:'pointer',whiteSpace:'nowrap',background:view===v?C.indigo:'transparent',color:view===v?'white':'var(--color-text-secondary)',transition:'all .15s',flexShrink:0}}>
              {l}
            </button>)}
          </nav>
          <button onClick={()=>setShowAdmin(true)} style={{padding:'5px 10px',borderRadius:8,border:'1px solid '+C.red+'40',background:'transparent',color:C.red,fontSize:11,fontWeight:700,cursor:'pointer',flexShrink:0}}>🔐 Admin</button>
        </div>
      </div>
    </div>
    <div style={{maxWidth:1240,margin:'0 auto',padding:'16px'}}>
      {view==='arena'&&<ArenaTab deals={deals} roster={roster} setRoster={setRoster} setCongrats={setCongrats} wagers={wagers} setWagers={setWagers} activity={activity} customStore={customStore}/>}
      {view==='incentives'&&<IncentivesTab incentives={incentives} setIncentives={setIncentives} roster={roster} deals={deals} activity={activity}/>}
      {view==='myteam'&&<MyTeamTab roster={roster} deals={deals} activity={activity}/>}
      {view==='reports'&&<ReportsTab deals={deals} roster={roster} activity={activity}/>}
      {view==='goals'&&<GoalsTab deals={deals} roster={roster}/>}
      {view==='redlines'&&<RedlinesTab deals={deals} roster={roster} ntpCounts={ntpCounts} installedCounts={installedCounts}/>}
      {view==='scoreboard'&&<PipelineTab deals={deals} roster={roster}/>}
      {view==='activity'&&<ActivityTab activity={activity} setActivity={setActivity} roster={roster} onAwardTokens={onAwardTokens} standards={standards}/>}
      {view==='calc'&&<CalculatorTab form={form} setForm={setForm} result={result} roster={roster} onSave={onSave} onExport={onExport} saved={saved} expMsg={expMsg} onNewDeal={onNewDeal} autoExportStatus={autoExportStatus}/>}
      {view==='history'&&<HistoryTab deals={deals} setDeals={setDeals} roster={roster}/>}
      {view==='roster'&&<RosterTab roster={roster} setRoster={setRoster} deals={deals} activity={activity} installedCounts={installedCounts}/>}
      {view==='accountability'&&<AccountabilityTab deals={deals} roster={roster}/>}
      {view==='sheets'&&<SheetsTab cfg={sheets} setCfg={setSheets} tok={tok} setTok={setTok} onDownloadCSV={downloadCSV} dealCount={deals.length}/>}
    </div>
  </div>;
}

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(React.createElement(AscendApp));
  </script>
</body>
</html>
